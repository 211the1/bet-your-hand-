<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLAY YOUR HAND HOST</title>
<style>
html,body{margin:0;width:100%;min-height:100%;overflow-x:hidden;overflow-y:auto;background:#000;overscroll-behavior-y:auto;-webkit-overflow-scrolling:touch}
body{font-family:system-ui,sans-serif}
#game{position:relative;width:100vw;height:100dvh;min-height:100dvh;overflow:hidden}
#room-art{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block}
#room-code{position:absolute;left:17%;top:54%;transform:translateX(-50%);z-index:5;color:#42ffe4;background:rgba(3,7,19,.82);border:3px solid #fff;border-radius:14px;padding:3px 6px;font-weight:1000;font-size:clamp(8px,1.3vw,16px);letter-spacing:2px;text-shadow:0 0 10px #00eaff;box-shadow:0 0 18px #00eaff;pointer-events:none}
#player-count{display:none;position:absolute;left:50%;top:15%;transform:translateX(-50%);z-index:5;color:#fff;font-weight:1000;font-size:clamp(13px,2vw,25px);text-shadow:0 0 8px #00eaff;pointer-events:none}
#status{display:none;position:absolute;left:50%;top:22%;transform:translateX(-50%);z-index:5;color:#21f17d;font-weight:900;font-size:clamp(11px,1.5vw,18px);text-align:center;text-shadow:0 0 8px #000;pointer-events:none}
#controls{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);z-index:10;display:flex;gap:12px;width:min(92vw,700px)}
button{flex:1;border:3px solid #fff;border-radius:14px;padding:14px 18px;font:1000 clamp(14px,2vw,20px)/1 system-ui,sans-serif;color:#fff;cursor:pointer;text-shadow:2px 2px 0 #000;box-shadow:0 0 18px #1687ff,0 7px 16px #0009;background:#0869ff}
button.start{background:#12a84a;box-shadow:0 0 18px #21f17d,0 7px 16px #0009}
button:disabled{opacity:.45;filter:grayscale(.7);cursor:not-allowed}
#card-display{position:absolute;left:50%;top:76%;transform:translate(-50%,-50%);z-index:3;display:flex;align-items:flex-start;justify-content:center;gap:42px;pointer-events:none}.host-pile{width:100px;text-align:center;color:#fff;font-weight:1000}.host-pile-title{height:34px;font-size:clamp(10px,1.2vw,16px);color:#ffd21c;text-shadow:0 0 8px #ffd21c;margin-bottom:3px;line-height:1.05}.host-deck-stack,.host-discard-stack{position:relative;width:100px;height:132px;margin:0 auto 7px}.host-deck-back,.host-discard-card{position:absolute;left:50%;top:50%;width:100px;height:132px;box-sizing:border-box;transform:translate(-50%,-50%);border-radius:12px}.host-deck-back{border:3px solid #1687ff;background:linear-gradient(145deg,#082b88,#07132e);box-shadow:0 0 16px #1687ff88;display:flex;align-items:center;justify-content:center;color:#fff;font:900 17px/1 Impact,"Arial Black",system-ui,sans-serif;text-shadow:0 0 8px #1687ff}.host-deck-back-2{transform:translate(-50%,-50%) translate(-3px,2px);opacity:.72}.host-deck-back-3{transform:translate(-50%,-50%) translate(-6px,4px);opacity:.48}.host-discard-card{display:flex;align-items:center;justify-content:center}.host-discard-card .card-display-card{width:100px!important;min-height:132px!important;height:132px!important;margin:0!important;padding:5px!important;border-width:3px!important;border-radius:12px!important;box-sizing:border-box}.host-discard-card .card-display-card img{width:72px;height:72px}.host-discard-card .card-display-card strong{font-size:16px}.host-discard-card .card-display-card small{font-size:11px}.host-discard-layer{position:absolute;left:50%;top:50%;width:100px;height:132px;transform:translate(-50%,-50%);border:3px solid #ffd43b;border-radius:12px;background:#15151f;box-sizing:border-box;opacity:.45}.host-pile-count{font-size:14px;line-height:1.05}.host-pile-note{font-size:10px;opacity:.8;margin-top:3px}@media(max-width:600px){#card-display{top:78%;gap:42px}.host-pile{width:100px}.host-deck-stack,.host-deck-back,.host-discard-stack,.host-discard-layer,.host-discard-card{width:100px;height:132px}.host-deck-back{font-size:16px}.host-pile-title{font-size:9px;height:30px}.host-pile-count{font-size:10px}.host-discard-card .card-display-card{width:100px!important;min-height:132px!important;height:132px!important}.host-discard-card .card-display-card img{width:72px;height:72px}.host-discard-card .card-display-card strong{font-size:15px}.host-discard-card .card-display-card small{font-size:10px}}>
