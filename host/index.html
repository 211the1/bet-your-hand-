<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLAY YOUR HAND HOST</title><link rel="stylesheet" href="/client/style.css?v=40"><link rel="stylesheet" href="/client/flame-fix.css?v=1"><style>
body.host-page{background:#030713;color:#fff;overflow-x:hidden}body.host-page main{max-width:none;width:100%;padding:8px 10px 18px}
.host-status{font-family:system-ui;font-weight:900;color:#21f17d;margin-bottom:8px}
.host-table-wrap{max-width:1500px;margin:0 auto}.host-table-head{display:grid;grid-template-columns:1fr 2fr 1fr;gap:10px;align-items:center;margin-bottom:10px}
.host-panel{border:3px solid #1687ff;border-radius:16px;background:#050b1d;box-shadow:0 0 18px #1687ff66;padding:9px;font-family:system-ui;font-weight:900}.host-panel h3{margin:0 0 4px;color:#ffd21c}.host-panel .room-code{font-size:clamp(22px,4vw,42px);letter-spacing:2px}.host-panel small{display:block;font-size:12px}
.host-title{font-family:Impact,Haettenschweiler,"Arial Narrow Bold",system-ui,sans-serif;font-size:clamp(28px,5vw,64px);line-height:.9;letter-spacing:2px;color:#fff;text-shadow:0 0 8px #1687ff,0 0 24px #1687ff,3px 3px 0 #164dbe;border:3px solid #1687ff;border-radius:20px;padding:9px;background:#07163a;box-shadow:0 0 24px #1687ff;text-align:center}
.host-controls{display:flex;gap:5px;justify-content:flex-end;flex-wrap:wrap}.host-controls button{width:auto;min-width:85px;margin:0;padding:9px;font-family:system-ui;font-weight:1000}
.host-table{position:relative;height:min(70vw,720px);min-height:560px;max-height:720px;border-radius:50%;border:8px solid #1687ff;background:radial-gradient(ellipse at center,#102d64 0,#07142f 48%,#020713 100%);box-shadow:0 0 35px #1687ff99,inset 0 0 45px #000;overflow:visible}.host-table:before{content:"";position:absolute;inset:9%;border:3px solid #1687ff55;border-radius:50%;box-shadow:inset 0 0 30px #1687ff33}
.host-table-logo{position:absolute;left:50%;top:39%;transform:translate(-50%,-50%);font-family:Impact,Haettenschweiler,"Arial Narrow Bold",system-ui,sans-serif;font-size:clamp(30px,5vw,68px);line-height:.9;color:#fff;text-shadow:0 0 10px #1687ff,3px 3px 0 #164dbe;text-align:center;white-space:nowrap}.host-table-tagline{position:absolute;left:50%;top:51%;transform:translateX(-50%);font-family:system-ui;font-size:clamp(10px,1.6vw,17px);font-weight:1000;color:#45c4ff;white-space:nowrap;letter-spacing:1px}
.host-table-cards{position:absolute;left:50%;top:67%;transform:translate(-50%,-50%);display:flex;gap:10px;align-items:center}.host-table-cards .table-card{width:95px;min-height:132px}
.host-seat{position:absolute;width:clamp(105px,12vw,180px);transform:translate(-50%,-50%);z-index:5}.host-seat .seat-chair{border:4px solid #1687ff;border-radius:28px;padding:6px;background:linear-gradient(#17234d,#080b19);box-shadow:0 0 18px #1687ff55}.host-seat .seat-avatar{width:100%;height:clamp(88px,10vw,150px);object-fit:cover;object-position:center;border-radius:18px;border:3px solid #fff;display:block}.host-seat .seat-name{margin-top:5px;border:3px solid #1687ff;border-radius:10px;background:#050b1d;padding:4px 5px;font-family:system-ui;font-size:clamp(10px,1.5vw,17px);font-weight:1000;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.host-seat .seat-score{font-family:system-ui;color:#ffd21c;font-size:clamp(9px,1.2vw,14px);font-weight:1000}.host-seat.active .seat-chair{border-color:#ffd21c;box-shadow:0 0 20px #ff6a00,0 0 35px #ff240066;animation:hostSeatPulse .55s ease-in-out infinite alternate}.host-seat.active .seat-name{border-color:#ffd21c;color:#ffd21c}@keyframes hostSeatPulse{from{transform:scale(.99)}to{transform:scale(1.03)}}
.host-seat:nth-child(1){left:9%;top:50%}.host-seat:nth-child(2){left:18%;top:19%}.host-seat:nth-child(3){left:38%;top:7%}.host-seat:nth-child(4){left:62%;top:7%}.host-seat:nth-child(5){left:82%;top:19%}.host-seat:nth-child(6){left:91%;top:50%}.host-seat:nth-child(7){left:78%;top:83%}.host-seat:nth-child(8){left:50%;top:92%}.host-seat:nth-child(9){left:22%;top:83%}
.host-empty{position:absolute;transform:translate(-50%,-50%);width:80px;height:55px;border:2px dashed #1687ff55;border-radius:16px;color:#1687ff66;font-family:system-ui;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center}.host-empty.e1{left:9%;top:50%}.host-empty.e2{left:18%;top:19%}.host-empty.e3{left:38%;top:7%}.host-empty.e4{left:62%;top:7%}.host-empty.e5{left:82%;top:19%}.host-empty.e6{left:91%;top:50%}.host-empty.e7{left:78%;top:83%}.host-empty.e8{left:50%;top:92%}.host-empty.e9{left:22%;top:83%}
.host-under-table{max-width:900px;margin:10px auto;font-family:system-ui}.host-game-info{border:3px solid #1687ff;border-radius:16px;background:#07112b;padding:10px;box-shadow:0 0 15px #1687ff55}.host-game-info b{color:#ffd21c}.host-legacy-game>h2,.host-legacy-game>.table-area{display:none}
@media(max-width:900px){body.host-page main{padding:4px 6px 12px}.host-table-head{grid-template-columns:78px 1fr 78px;gap:5px}.host-panel{padding:6px;border-width:2px;border-radius:10px;font-size:9px}.host-panel .room-code{font-size:15px}.host-panel small{font-size:8px}.host-title{font-size:22px;border-width:2px;border-radius:11px;padding:6px}.host-controls{gap:3px}.host-controls button{min-width:0;width:100%;padding:7px 3px;font-size:9px}.host-table{height:720px;min-height:720px;border-width:5px}.host-seat{width:105px}.host-seat .seat-avatar{height:88px}.host-seat .seat-name{font-size:10px}.host-table-logo{font-size:34px}.host-table-tagline{font-size:9px}.host-table-cards{top:67%}.host-table-cards .table-card{width:72px;min-height:100px}}
@media(max-width:520px){.host-table{height:620px;min-height:620px}.host-seat{width:82px}.host-seat .seat-avatar{height:68px;border-width:2px;border-radius:12px}.host-seat .seat-chair{border-width:2px;border-radius:16px;padding:3px}.host-seat .seat-name{font-size:8px;border-width:2px;padding:3px}.host-seat .seat-score{font-size:8px}.host-table-logo{font-size:25px}.host-table-tagline{font-size:7px}.host-table-cards{top:68%}.host-table-cards .table-card{width:55px;min-height:78px}}
</style></head><body class="host-page"><main><h1>PLAY YOUR HAND</h1><div id="status" class="host-status">CONNECTING TO GAME SERVER…</div><button id="create">CREATE ROOM CODE</button><div id="room"></div><div id="players"></div><button id="start" hidden>START GAME</button><button id="restart" hidden>RESTART GAME</button><section id="game"></section></main><script src="/host/app.js?v=6"></script></body></html>
