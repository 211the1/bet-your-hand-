<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLAY YOUR HAND HOST</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{font-family:system-ui,sans-serif}
#game{position:relative;width:100vw;height:100dvh;overflow:hidden}
#room-art{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block}
#room-code{position:absolute;left:50%;top:5%;transform:translateX(-50%);z-index:5;color:#42ffe4;background:rgba(3,7,19,.82);border:3px solid #fff;border-radius:14px;padding:7px 18px;font-weight:1000;font-size:clamp(22px,4vw,48px);letter-spacing:5px;text-shadow:0 0 10px #00eaff;box-shadow:0 0 18px #00eaff;pointer-events:none}
#player-count{position:absolute;left:50%;top:15%;transform:translateX(-50%);z-index:5;color:#fff;font-weight:1000;font-size:clamp(13px,2vw,25px);text-shadow:0 0 8px #00eaff;pointer-events:none}
#status{position:absolute;left:50%;top:22%;transform:translateX(-50%);z-index:5;color:#21f17d;font-weight:900;font-size:clamp(11px,1.5vw,18px);text-align:center;text-shadow:0 0 8px #000;pointer-events:none}
#controls{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);z-index:10;display:flex;gap:12px;width:min(92vw,700px)}
button{flex:1;border:3px solid #fff;border-radius:14px;padding:14px 18px;font:1000 clamp(14px,2vw,20px)/1 system-ui,sans-serif;color:#fff;cursor:pointer;text-shadow:2px 2px 0 #000;box-shadow:0 0 18px #1687ff,0 7px 16px #0009;background:#0869ff}
button.start{background:#12a84a;box-shadow:0 0 18px #21f17d,0 7px 16px #0009}
button:disabled{opacity:.45;filter:grayscale(.7);cursor:not-allowed}
#seats{position:absolute;inset:0;z-index:4;pointer-events:none}
.seat{position:absolute;transform:translate(-50%,-50%);width:clamp(70px,10vw,150px);text-align:center}
.seat img{display:block;width:100%;height:clamp(85px,13vw,190px);object-fit:contain;object-position:center bottom;filter:drop-shadow(0 8px 10px #0009)}
.seat-label{margin-top:-3px;padding:3px 6px;border:2px solid #1687ff;border-radius:8px;background:#030713e8;color:#fff;font-size:clamp(7px,1vw,13px);font-weight:1000;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat-label b{display:block;color:#ffd21c}
.s1{left:8%;top:52%}.s2{left:17%;top:23%}.s3{left:35%;top:13%}.s4{left:65%;top:13%}.s5{left:84%;top:23%}.s6{left:92%;top:52%}.s7{left:80%;top:78%}.s8{left:50%;top:87%}.s9{left:20%;top:78%}
@media(max-width:600px){
 #controls{bottom:2%;gap:7px;width:96vw}
 button{padding:11px 7px;border-width:2px;border-radius:10px;font-size:14px}
 #room-code{top:3%;padding:6px 12px;border-width:2px;letter-spacing:3px}
 #player-count{top:12%}
 #status{top:18%}
 .seat{width:70px}.seat img{height:92px}.seat-label{font-size:7px;padding:2px 4px}
}
</style>
</head>
<body>
<div id="game">
  <img id="room-art" src="/host-room.png" alt="PLAY YOUR HAND host room">
  <div id="room-code">----</div>
  <div id="player-count">0 / 9 PLAYERS</div>
  <div id="status">CONNECTING…</div>
  <div id="seats"></div>
  <div id="controls">
    <button id="generate">GENERATE CODE</button>
    <button id="start" class="start" disabled>START GAME</button>
  </div>
</div>
<script src="/host/app.js?v=11"></script>
</body>
</html>
