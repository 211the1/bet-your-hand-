<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLAY YOUR HAND HOST</title>
<style>
html,body{margin:0;width:100%;min-height:100%;overflow-x:hidden;overflow-y:auto;background:#000;overscroll-behavior-y:auto;-webkit-overflow-scrolling:touch}
body{font-family:system-ui,sans-serif}
#game{position:relative;width:100vw;height:100dvh;min-height:100dvh;overflow:hidden}
#room-art{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block}
#room-code{position:absolute;left:17%;top:54%;transform:translateX(-50%);z-index:5;color:#42ffe4;background:rgba(3,7,19,.82);border:3px solid #fff;border-radius:14px;padding:3px 6px;font-weight:1000;font-size:clamp(8px,1.3vw,16px);letter-spacing:2px;text-shadow:0 0 10px #00eaff;box-shadow:0 0 18px #00eaff;pointer-events:none}
#player-count{display:none;position:absolute;left:50%;top:15%;transform:translateX(-50%);z-index:5;color:#fff;font-weight:1000;font-size:clamp(13px,2vw,25px);text-shadow:0 0 8px #00eaff;pointer-events:none}
#status{display:none;position:absolute;left:50%;top:22%;transform:translateX(-50%);z-index:5;color:#21f17d;font-weight:900;font-size:clamp(11px,1.5vw,18px);text-align:center;text-shadow:0 0 8px #000;pointer-events:none}
#controls{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);z-index:10;display:flex;gap:12px;width:min(92vw,700px)}
button{flex:1;border:3px solid #fff;border-radius:14px;padding:14px 18px;font:1000 clamp(14px,2vw,20px)/1 system-ui,sans-serif;color:#fff;cursor:pointer;text-shadow:2px 2px 0 #000;box-shadow:0 0 18px #1687ff,0 7px 16px #0009;background:#0869ff}
button.start{background:#12a84a;box-shadow:0 0 18px #21f17d,0 7px 16px #0009}
button:disabled{opacity:.45;filter:grayscale(.7);cursor:not-allowed}
#card-display{position:absolute;left:50%;top:64%;transform:translate(-50%,-50%);z-index:3;display:flex;align-items:flex-start;justify-content:center;gap:clamp(18px,3vw,34px);pointer-events:none}.host-pile{width:clamp(95px,10vw,125px);text-align:center;color:#fff;font-weight:1000}.host-pile-title{font-size:clamp(10px,1.2vw,16px);color:#ffd21c;text-shadow:0 0 8px #ffd21c;margin-bottom:6px}.host-deck-stack{position:relative;width:125px;height:175px;margin:0 auto 7px}.host-deck-back{position:absolute;left:50%;top:50%;width:125px;height:175px;transform:translate(-50%,-50%) rotate(-4deg);border:4px solid #1687ff;border-radius:15px;background:linear-gradient(145deg,#082b88,#07132e);box-shadow:0 0 20px #1687ff88;display:flex;align-items:center;justify-content:center;color:#fff;font:900 22px/1 Impact,"Arial Black",system-ui,sans-serif;text-shadow:0 0 8px #1687ff}.host-deck-back-2{transform:translate(-50%,-50%) rotate(5deg);z-index:-1;opacity:.75}.host-deck-back-3{transform:translate(-50%,-50%) rotate(-9deg);z-index:-2;opacity:.5}.host-discard{width:125px;height:175px;margin:0 auto 7px;display:flex;align-items:center;justify-content:center}.card-display-card{width:125px;min-height:175px;box-sizing:border-box;border:4px solid #1687ff;border-radius:15px;padding:6px;background:#15151f;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;box-shadow:0 6px 14px #0008;text-align:center;color:#fff}.card-display-card img{width:72px;height:72px;object-fit:cover;object-position:center;border-radius:8px;border:2px solid #fff}.card-display-card strong{font-size:16px;line-height:1.05;font-weight:900}.card-display-card small{font-size:11px;font-weight:800}.card-display-card.color-red{border-color:#ff4b4b}.card-display-card.color-blue{border-color:#1687ff}.card-display-card.color-green{border-color:#21d46b}.card-display-card.color-yellow{border-color:#ffd43b}.card-display-card.wild{background:#111;border-color:#fff}.card-display-card.play-special{background:#19110a;border-color:#ffd21c}.card-display-card.special{font-size:20px;font-weight:900}.host-pile-count{font-size:14px}.host-pile-note{font-size:10px;opacity:.8;margin-top:3px}@media(max-width:600px){#card-display{top:66%;gap:12px}.host-pile{width:92px}.host-deck-stack,.host-deck-back{width:96px;height:134px}.host-discard{width:96px;height:134px}.card-display-card{width:96px;min-height:134px;border-width:3px}.card-display-card img{width:56px;height:56px}.host-deck-back{font-size:17px;border-width:3px}}\n#seats{position:absolute;inset:0;z-index:4;pointer-events:none}
.seat{position:absolute;transform:translate(-50%,-50%);width:clamp(82px,11vw,150px);text-align:center;transform-origin:center bottom}
.seat img{height:clamp(130px,17vw,210px)!important}
.s1{left:17%;top:36%}.s2{left:31%;top:34%}.s3{left:43%;top:34%}.s4{left:56%;top:34%}.s5{left:69%;top:34%}.s6{left:84%;top:36%}
.s7,.s8,.s9{display:none}
.seat img{display:block;width:100%;height:clamp(85px,13vw,190px);object-fit:contain;object-position:center bottom;filter:drop-shadow(0 8px 10px #0009)}
.seat-label{margin-top:-3px;padding:3px 6px;border:2px solid #1687ff;border-radius:8px;background:#030713e8;color:#fff;font-size:clamp(7px,1vw,13px);font-weight:1000;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat-label b{display:block;color:#ffd21c}

.seat-rock{animation:seatRock .65s ease-in-out}
.seat-bounce{animation:seatBounce .7s ease-in-out}
.seat-wiggle{animation:seatWiggle .6s ease-in-out}
@keyframes seatRock{
  0%,100%{transform:translate(-50%,-50%) rotate(0)}
  25%{transform:translate(-50%,-50%) rotate(-4deg)}
  75%{transform:translate(-50%,-50%) rotate(4deg)}
}
@keyframes seatBounce{
  0%,100%{transform:translate(-50%,-50%)}
  35%{transform:translate(-50%,-58%)}
  70%{transform:translate(-50%,-47%)}
}
@keyframes seatWiggle{
  0%,100%{transform:translate(-50%,-50%)}
  25%{transform:translate(calc(-50% - 5px),-50%)}
  50%{transform:translate(calc(-50% + 5px),-50%)}
  75%{transform:translate(calc(-50% - 3px),-50%)}
}

@media(max-width:600px){
 #controls{bottom:2%;gap:7px;width:96vw}
 button{padding:11px 7px;border-width:2px;border-radius:10px;font-size:14px}
 #room-code{top:54%;left:17%;padding:2px 4px;border-width:1px;letter-spacing:1px}
 #player-count{top:12%}
 #status{top:18%}
 .seat{width:70px}.seat img{height:115px!important}.seat-label{font-size:7px;padding:2px 4px}
}
</style>
</head>
<body>
<div id="game">
  <img id="room-art" src="/host-room.png" alt="PLAY YOUR HAND host room">
  <div id="room-code">----</div><div id="card-display"></div>
  <div id="player-count">0 / 6 PLAYERS</div>
  <div id="status">CONNECTING…</div>
  <div id="seats"></div>
  <div id="controls">
    <button id="generate">GENERATE CODE</button>
    <button id="start" class="start" disabled>START GAME</button>
  </div>
</div>
<script src="/host/app.js?v=14"></script>
</body>
</html>
