<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BET YOUR HAND — Host</title><style>
:root{--blue:#1687ff;--purple:#713cff;--green:#08b978;--gold:#d4af37;--bg:#070b12;--panel:#111a28}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#182a45,#070b12 65%);color:#fff;font-family:Arial,sans-serif}main{max-width:1200px;margin:auto;padding:24px}.top{text-align:center}.top h1{font-size:clamp(38px,6vw,70px);margin:0}.sub{color:#aeb9cb}.code{font-size:54px;font-weight:900;letter-spacing:14px}.layout{display:grid;grid-template-columns:1fr 2fr 1fr;gap:18px;align-items:start}.panel{background:#111a28eF;border:1px solid #2c3a51;border-radius:22px;padding:18px;box-shadow:0 15px 40px #0008}.players{display:grid;gap:10px}.player{display:flex;align-items:center;gap:12px;background:#1a2638;border-radius:15px;padding:10px}.player img{width:58px;height:58px;border-radius:50%;object-fit:cover;object-position:50% 25%}.player.active{outline:3px solid var(--blue);box-shadow:0 0 18px #1687ff77}.score{margin-left:auto;text-align:right}.center{text-align:center}.card{width:min(300px,70%);aspect-ratio:2/2.8;margin:10px auto;border-radius:26px;border:5px solid white;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:20px;box-shadow:0 20px 45px #0009}.card .name{font-size:42px;font-weight:900}.red{background:#c72f3f}.blue{background:#1c69d9}.green{background:#078c62}.yellow{background:#c79d18;color:#111}.wild{background:linear-gradient(135deg,#d7263d,#1687ff,#08b978,#d4af37)}.special{background:linear-gradient(145deg,#d4af37,#713cff)}button{width:100%;padding:16px;border:0;border-radius:14px;background:var(--blue);color:#fff;font-size:18px;font-weight:900;margin:7px 0}button.purple{background:var(--purple)}.wheel{width:260px;aspect-ratio:1;border-radius:50%;margin:15px auto;border:10px solid #fff;background:conic-gradient(#1687ff 0 11.11%,#713cff 11.11% 22.22%,#08b978 22.22% 33.33%,#d4af37 33.33% 44.44%,#1687ff 44.44% 55.55%,#08b978 55.55% 66.66%,#713cff 66.66% 77.77%,#d4af37 77.77% 88.88%,#ff3048 88.88%);display:grid;place-items:center;font-weight:900}.status{text-align:center;min-height:26px;color:#8ee6b1}.big{font-size:34px;font-weight:900;color:#ffd94a}@media(max-width:850px){.layout{grid-template-columns:1fr}.card{width:220px}}
</style></head><body><main><div class="top"><h1>BET YOUR HAND</h1><div class="sub">HOST / GAME NIGHT CONTROL</div><div id="code" class="code">----</div><div id="status" class="status">Connecting…</div></div><div class="layout"><section class="panel"><h2>PLAYERS</h2><div id="players" class="players"></div><button id="start">START GAME</button><button id="reset" class="purple">START OVER</button></section><section class="panel center"><h2 id="round">ROUND 1</h2><div id="turn" class="big">Waiting for players</div><div id="current"></div><div id="wheelBox"></div></section><section class="panel"><h2>GAME INFO</h2><div id="info">Players: 0</div><hr><p style="color:#aeb9cb">The host controls the room. Players control their own cards from their phones.</p></section></div></main><script>
const WS='wss://bet-your-hand.onrender.com';const chars=['Bug','Face','Ling Ling','Beanz','The One','Boone','Chicken Joe','Juby','Meemaw'];const img=c=>c?c.replaceAll(' ','_')+'.jpg':'Bug.jpg';let ws=null,me=null,state=null;const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function send(type,data={}){if(ws?.readyState===1)ws.send(JSON.stringify({type,...data}))}
function connect(){ws=new WebSocket(WS);ws.onopen=()=>send('CREATE_ROOM',{name:'Host'});ws.onclose=()=>{$('status').textContent='Disconnected'};ws.onerror=()=>{$('status').textContent='Connection problem'};ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='ERROR'){$('status').textContent=m.error;return}if(m.type==='ROOM_CREATED'){me=m;localStorage.setItem('byhHost',JSON.stringify(m));$('code').textContent=m.code;$('status').textContent='Connected — waiting for players'}if(m.type==='STATE'){state=m;render()}if(m.type==='RESET_ROOM'){localStorage.removeItem('byhHost');location.reload()}}}
function render(){if(!state)return;$('code').textContent=state.roomCode;const g=state.game;const list=g?g.players:state.players;$('players').innerHTML=list.map(p=>{const active=g&&p.id===g.turnPlayerId;return `<div class="player ${active?'active':''}"><img src="${img(p.character)}"><div><b>${esc(p.name)}</b><div>${esc(p.character||'')}</div></div><div class="score">${g?p.points??0:'—'}<br><small>${g?p.handCount+' cards':p.connected?'ONLINE':'OFFLINE'}</small></div></div>`}).join('');$('start').disabled=state.players.length<2||state.started;if(!g){$('turn').textContent=state.players.length<2?'Need 2 players to start':'Ready';$('current').innerHTML='';$('info').textContent='Players: '+state.players.length;return}$('round').textContent='ROUND '+g.round;$('turn').textContent=g.phase==='finished'?'GAME OVER':(state.players.find(p=>p.id===g.turnPlayerId)?.name||'Player')+' — YOUR TURN';$('info').innerHTML=`Players: ${g.players.length}<br>Color: ${(g.currentColor||'—').toUpperCase()}<br>Direction: ${g.direction===1?'CLOCKWISE':'COUNTER-CLOCKWISE'}`;const c=g.topCard;$('current').innerHTML=`<div class="card ${c?.type==='SPECIAL_POWER'?'special':c?.type==='WILD'?'wild':c?.color||'blue'}"><div>${esc(c?.type==='SPECIAL_POWER'?'BET YOUR HAND':c?.action||'CHARACTER')}</div><div class="name">${esc(c?.character||c?.action||'—')}</div><div>${esc((c?.color||'special').toUpperCase())}</div></div>`;if(g.wheelResult)$('wheelBox').innerHTML=`<div class="wheel">${esc(g.wheelResult.character)}<br>${esc(g.wheelResult.power)}</div>`;else $('wheelBox').innerHTML=''}
$('start').onclick=()=>send('START_GAME');$('reset').onclick=()=>send('RESET_ROOM');connect();
</script></body></html>
