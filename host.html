<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>BET YOUR HAND — Host</title>
<style>html,body{margin:0;min-height:100%;background:#05020d;color:#fff;font-family:Arial,sans-serif}main{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}button{font:inherit;font-weight:900;font-size:20px;padding:16px 24px;border-radius:14px;border:2px solid #fff;background:#713cff;color:#fff}</style>
</head>
<body>
<main>
<div>
<h1>BET YOUR HAND</h1>
<p>Opening Host / TV…</p>
<button id="open" type="button">OPEN HOST / TV</button>
</div>
</main>
<script>
(function(){
  var target='./index.html?host=1&hostbuild='+Date.now();
  function go(){window.location.replace(target)}
  document.getElementById('open').addEventListener('click',go);
  setTimeout(go,400);
})();
</script>
</body>
</html>
