<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BET YOUR HAND — Host</title></head><body><div style="font-family:Arial,sans-serif;text-align:center;padding:40px">Loading Host / TV…</div><script>(async()=>{try{history.replaceState(null,'','./host.html?host');const r=await fetch('./index.html?hostbuild='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const html=await r.text();document.open();document.write(html);document.close();}catch(e){document.body.innerHTML='<div style="font-family:Arial,sans-serif;text-align:center;padding:40px"><h2>Host screen could not load.</h2><p>Please refresh once.</p></div>';}})();</script></body></html>
