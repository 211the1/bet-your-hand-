<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BET YOUR HAND Host</title><style>:root{--b:#1687ff;--p:#713cff;--g:#08b978;--y:#d4af37}*{box-sizing:border-box}body{margin:0;background:#070b12;color:#fff;font:18px Arial}main{max-width:1200px;margin:auto;padding:22px}.head{text-align:center}.head h1{font-size:clamp(40px,6vw,72px);margin:0}.code{font-size:58px;font-weight:900;letter-spacing:12px}.status{color:#8ee6b1;min-height:25px}.grid{display:grid;grid-template-columns:1fr 2fr 1fr;gap:16px}.panel{background:#121a28;border:1px solid #30415a;border-radius:20px;padding:18px}.player{display:grid;grid-template-columns:50px 1fr auto;gap:9px;align-items:center;background:#1a2638;padding:8px;border-radius:12px;margin:8px 0}.player img{width:50px;height:50px;border-radius:50%;object-fit:cover;object-position:50% 25%}.active{outline:3px solid var(--b)}button{border:0;border-radius:12px;padding:12px;background:var(--b);color:#fff;font-weight:900}button.call{background:var(--y);color:#111;font-size:12px}.wide{width:100%;margin:6px 0}.card{width:230px;aspect-ratio:2/2.8;margin:15px auto;border:4px solid #fff;border-radius:22px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center}.name{font-size:34px;font-weight:900}.red{background:#c72f3f}.blue{background:#1c69d9}.green{background:#078c62}.yellow{background:#c79d18;color:#111}.wild{background:linear-gradient(135deg,#d7263d,#1687ff,#08b978,#d4af37)}.special{background:linear-gradient(145deg,#d4af37,#713cff)}.wheel{width:240px;aspect-ratio:1;margin:12px auto;border-radius:50%;border:8px solid #fff;background:conic-gradient(#1687ff 0 11.11%,#713cff 11.11% 22.22%,#08b978 22.22% 33.33%,#d4af37 33.33% 44.44%,#1687ff 44.44% 55.55%,#08b978 55.55% 66.66%,#713cff 66.66% 77.77%,#d4af37 77.77% 88.88%,#ff3048 88.88%);display:grid;place-items:center;text-align:center;font-weight:900}@media(max-width:850px){.grid{grid-template-columns:1fr}}</style></head><body><main><header class="head"><h1>BET YOUR HAND</h1><div>HOST / TV • GAME NIGHT</div><div id="code" class="code">----</div><div id="status" class="status">Connecting…</div></header><div class="grid"><section class="panel"><h2>PLAYERS</h2><div id="players"></div><button id="start" class="wide">START GAME</button><button id="reset" class="wide" style="background:var(--p)">START OVER</button></section><section class="panel" style="text-align:center"><h2 id="round">ROUND 1</h2><h2 id="turn">Waiting for players</h2><div id="current"></div><div id="power"></div></section><section class="panel"><h2>GAME INFO</h2><div id="info">Players: 0</div><p>The host is not a player. Players use their phones for cards and choices.</p></section></div></main><script>
const WS='wss://bet-your-hand.onrender.com';let ws=null,me=null,state=null,retry=null,reconnecting=false;const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const img=c=>String(c||'Bug').replaceAll(' ','_')+'.jpg';
function send(type,data={}){if(ws?.readyState===1)ws.send(JSON.stringify({type,...data}))}
function startNewRoom(){reconnecting=false;me=null;localStorage.removeItem('byhHost');if(ws&&ws.readyState<2)try{ws.close()}catch(_){};ws=null;connect(false)}
function connect(re){if(ws&&ws.readyState<2)return;reconnecting=re;ws=new WebSocket(WS);ws.onopen=()=>{clearTimeout(retry);if(re&&me?.code&&me?.hostId&&me?.hostToken)send('RECONNECT',{code:me.code,hostId:me.hostId,hostToken:me.hostToken});else send('CREATE_ROOM',{name:'Host'})};ws.onclose=()=>{if(me?.code&&me?.hostToken)retry=setTimeout(()=>connect(true),1500);else retry=setTimeout(()=>connect(false),1500)};ws.onerror=()=>{$('status').textContent='Connecting to game server…'};ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='ERROR'){if(reconnecting&&/Player not found|Room not found|Invalid reconnect credentials|Already connected/i.test(m.error||'')){startNewRoom();return}$('status').textContent=m.error;return}if(m.type==='ROOM_CREATED'||m.type==='RECONNECTED'){me={...me,...m,host:true,hostId:m.hostId||me.hostId,hostToken:m.hostToken||me.hostToken};localStorage.setItem('byhHost',JSON.stringify(me));reconnecting=false;$('status').textContent='Connected'}if(m.type==='STATE'){state=m;render()}if(m.type==='RESET_ROOM'){localStorage.removeItem('byhHost');location.reload()}}}
function render(){if(!state)return;$('code').textContent=state.roomCode;const g=state.game;$('players').innerHTML=state.players.map(p=>{const q=g?.players.find(x=>x.id===p.id);return `<div class="player ${g&&p.id===g.turnPlayerId?'active':''}"><img src="${img(p.character)}"><div><b>${esc(p.name)}</b><br><small>${esc(p.character)}</small></div><div>${g?q?.points??0:'—'}<br><button class="call" onclick="call('${p.id}')">CALL</button></div></div>`}).join('');$('start').disabled=state.players.length<2||state.started;if(!g){$('turn').textContent=state.players.length<2?'Need 2 players':'Ready';$('info').textContent='Players: '+state.players.length;return}$('round').textContent='ROUND '+g.round;const cur=state.players.find(p=>p.id===g.turnPlayerId);$('turn').textContent=g.phase==='finished'?'GAME OVER':(cur?.name||'Player')+' — YOUR TURN';$('info').innerHTML=`Players: ${g.players.length}<br>Color: ${(g.currentColor||'—').toUpperCase()}<br>Direction: ${g.direction===1?'CLOCKWISE':'COUNTER-CLOCKWISE'}`;const c=g.topCard;$('current').innerHTML=`<div class="card ${c?.type==='SPECIAL_POWER'?'special':c?.type==='WILD'?'wild':c?.color||'blue'}"><div>${esc(c?.type==='SPECIAL_POWER'?'BET YOUR HAND':c?.action||'CHARACTER')}</div><div class="name">${esc(c?.character||c?.action||'—')}</div><div>${esc((c?.color||'POWER').toUpperCase())}</div></div>`;$('power').innerHTML=g.wheelResult?`<div class="wheel">${esc(g.wheelResult.character)}<br>${esc(g.wheelResult.power)}</div>`:'';if(g.phase==='finished'){const w=g.players.find(p=>p.id===g.winnerId);$('turn').textContent='GAME OVER — '+(w?.name||'WINNER')}}function call(id){send('CALL_PLAYER',{playerId:id})}$('start').onclick=()=>send('START_GAME');$('reset').onclick=()=>send('RESET_ROOM');try{me=JSON.parse(localStorage.getItem('byhHost')||'null')}catch(_){me=null}connect(!!(me?.code&&me?.hostId&&me?.hostToken));
</script></body></html>
