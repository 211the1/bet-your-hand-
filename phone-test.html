<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BET YOUR HAND Phone Test</title>
<style>
body{margin:0;background:#10131a;color:white;font:18px Arial;text-align:center}
main{max-width:520px;margin:auto;padding:24px 18px}
section{background:#191e28;border-radius:18px;padding:20px;margin:18px 0}
input,button{width:100%;padding:15px;margin:7px 0;border-radius:12px;font-size:18px;box-sizing:border-box}
input{background:#0f131b;color:white;border:1px solid #465064}
button{border:0;background:#1687ff;color:white;font-weight:bold}
.secondary{background:#303847}.code{font-size:42px;font-weight:bold;letter-spacing:8px;margin:15px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{min-height:90px;background:#172b48;border:2px solid #1687ff}
.hidden{display:none}.status{min-height:25px}.offline{opacity:.65}
</style>
</head>
<body><main>
<h1>BET YOUR HAND</h1><p>Phone-to-phone test</p>
<section id="home">
<input id="name" placeholder="Your name" maxlength="20" autocomplete="name">
<button onclick="host()">CREATE ROOM</button>
<input id="code" placeholder="ROOM CODE" maxlength="4" autocapitalize="characters">
<button class="secondary" onclick="join()">JOIN ROOM</button>
<div id="homeStatus" class="status"></div>
</section>
<section id="room" class="hidden">
<div id="role"></div><div class="code" id="roomCode"></div><div class="status" id="status"></div>
<div id="players"></div><button id="start" onclick="send('START_GAME')">START GAME</button>
</section>
<section id="game" class="hidden">
<h2 id="turn"></h2><div id="info"></div><div id="cards" class="cards"></div>
<button class="secondary" onclick="send('DRAW')">DRAW</button>
</section>
</main>
<script>
const WS='wss://bet-your-hand.onrender.com';
let socket=null,me=null,reconnectTimer=null,reconnecting=false;
const $=x=>document.getElementById(x);
function status(x){if($('status'))$('status').textContent=x;if($('homeStatus'))$('homeStatus').textContent=x}
function saveSession(){if(me)localStorage.setItem('byhSession',JSON.stringify(me))}
function loadSession(){try{me=JSON.parse(localStorage.getItem('byhSession')||'null')}catch(_){me=null}}
function clearSession(){me=null;localStorage.removeItem('byhSession')}
function connect(mode='new'){
  if(socket&&socket.readyState===WebSocket.OPEN)return;
  socket=new WebSocket(WS);
  socket.onopen=()=>{
    status(reconnecting?'Reconnecting...':'Connected');
    if(mode==='reconnect'&&me){
      send('RECONNECT',{code:me.code,playerId:me.playerId,reconnectToken:me.reconnectToken});
    }else if(mode==='host'){
      send('CREATE_ROOM',{name:me?.name||$('name').value.trim()||'Host'});
    }else if(mode==='join'){
      send('JOIN_ROOM',{code:$('code').value.trim().toUpperCase(),name:$('name').value.trim()||'Player'});
    }
  };
  socket.onerror=()=>status('Connection error');
  socket.onclose=()=>{
    status('Disconnected — trying to reconnect');
    if(me&&!reconnectTimer){reconnectTimer=setTimeout(()=>{reconnectTimer=null;reconnecting=true;connect('reconnect')},1200)}
  };
  socket.onmessage=e=>{
    const m=JSON.parse(e.data);
    if(m.type==='ERROR'){
      if(reconnecting){reconnecting=false;clearSession();$('home').classList.remove('hidden');$('room').classList.add('hidden');$('game').classList.add('hidden')}
      status(m.error);return;
    }
    if(m.type==='ROOM_CREATED'||m.type==='ROOM_JOINED'||m.type==='RECONNECTED'){
      if(m.type==='ROOM_CREATED'||m.type==='ROOM_JOINED')me=m;
      saveSession();reconnecting=false;
      $('home').classList.add('hidden');$('room').classList.remove('hidden');$('role').textContent=(m.type==='ROOM_CREATED'||m.host)?'HOST':'PLAYER';
      $('roomCode').textContent=m.code;
      if(m.type!=='ROOM_CREATED'&&!m.host)$('start').classList.add('hidden');
      status(m.type==='RECONNECTED'?'Reconnected':'Connected');
    }
    if(m.type==='STATE')render(m);
  };
}
function send(type,data={}){if(socket?.readyState===WebSocket.OPEN)socket.send(JSON.stringify({type,...data}));else status('Not connected')}
function host(){
  const name=$('name').value.trim()||'Host';
  me={name};
  connect('host');
}
function join(){
  const code=$('code').value.trim().toUpperCase();
  if(code.length!==4){status('Enter the 4-character room code');return}
  const name=$('name').value.trim()||'Player';
  me={name};
  connect('join');
}
function render(m){
  let g=m.game;
  if(!g){
    $('players').innerHTML=m.players.map(p=>'<p class="'+(p.connected?'':'offline')+'">'+safe(p.name)+(p.connected?'':' (offline)')+'</p>').join('');
    return;
  }
  $('room').classList.add('hidden');$('game').classList.remove('hidden');
  let mine=g.players.find(p=>p.id===me?.playerId),current=g.players.find(p=>p.id===g.turnPlayerId);
  $('turn').textContent=current?.id===mine?.id?'YOUR TURN':'Waiting for '+safe(current?.name||'player');
  $('info').textContent='Your cards: '+(mine?.handCount||0)+' | Color: '+(g.currentColor||'—');
  $('cards').innerHTML=(g.viewerHand||[]).map((c,i)=>'<button class="card" onclick="send(\'PLAY_CARD\',{handIndex:'+i+'})"><b>'+safe(c.character||c.action||c.type)+'</b><br><small>'+safe(c.color||'special')+'</small></button>').join('');
}
function safe(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
loadSession();
if(me?.code&&me?.playerId&&me?.reconnectToken){$('home').classList.add('hidden');$('room').classList.remove('hidden');$('role').textContent=me.host?'HOST':'PLAYER';$('roomCode').textContent=me.code;connect('reconnect')}
</script>
</body></html>
