name: Build separate character images

on:
  push:
    branches: [main]

jobs:
  build:
    if: github.actor != 'github-actions[bot]' && github.event.head_commit.message == 'Build separate character images'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build individual character images
        run: |
          python -m pip install --quiet pillow
          python - <<'PY2'
          import base64,re
          from io import BytesIO
          from pathlib import Path
          from PIL import Image,ImageFilter
          js=Path('characters/character-images.js').read_text(encoding='utf-8')
          m=re.search(r"SPRITE='data:image/webp;base64,([^']+)'",js)
          if not m: raise SystemExit('Sprite data not found')
          im=Image.open(BytesIO(base64.b64decode(m.group(1)))).convert('RGB')
          w,h=im.size
          if w<900 or h<900: raise SystemExit(f'Unexpected sprite size: {w}x{h}')
          chars=['Bug','Face','Ling Ling','Beanz','The One','Boone','Chicken Joe','Juby','Meemaw']
          out=Path('characters/assets'); out.mkdir(parents=True,exist_ok=True)
          for i,ch in enumerate(chars):
              x=(i%3)*(w//3); y=(i//3)*(h//3)
              crop=im.crop((x,y,x+w//3,y+h//3))
              crop=crop.resize((600,600),Image.Resampling.LANCZOS)
              crop=crop.filter(ImageFilter.UnsharpMask(radius=1.0,percent=35,threshold=3))
              crop.save(out/(ch.replace(' ','_')+'.webp'),'WEBP',quality=95,method=6)
          PY2
      - name: Replace sprite renderer with individual images
        run: |
          cat > characters/character-images.js <<'JS'
          /* BET YOUR HAND — individual character images. Each character uses its own full image; no sprite-sheet cropping. */
          (function(){
            const chars=['Bug','Face','Ling Ling','Beanz','The One','Boone','Chicken Joe','Juby','Meemaw'];
            const urls={};
            chars.forEach(ch=>{urls[ch]='/characters/assets/'+ch.replace(/ /g,'_')+'.webp';});
            function stylePick(){
              document.querySelectorAll('.charPick').forEach(function(b){
                const n=b.querySelector('.charName'); if(!n)return;
                const ch=n.textContent.trim(); if(!urls[ch])return;
                let im=b.querySelector('.charImg');
                if(!im){im=document.createElement('img');im.className='charImg';b.insertBefore(im,b.firstChild);}
                im.src=urls[ch]; im.alt=ch; im.decoding='async';
                im.style.backgroundImage='none'; im.style.backgroundSize='auto'; im.style.backgroundPosition='center';
                im.style.objectFit='cover'; im.style.objectPosition='center center';
              });
            }
            function patchPlayerCards(){
              document.querySelectorAll('#players .player,#gamePlayers .player').forEach(function(d){
                const smalls=d.querySelectorAll('.small'); if(smalls.length<1)return;
                const ch=smalls[0].textContent.trim(); if(!urls[ch])return;
                let im=d.querySelector('.playerCharImg');
                if(!im){im=document.createElement('img');im.className='playerCharImg';d.insertBefore(im,d.firstChild);}
                im.src=urls[ch]; im.alt=ch; im.decoding='async';
                im.style.backgroundImage='none'; im.style.backgroundSize='cover'; im.style.backgroundPosition='center center';
                im.style.objectFit='cover'; im.style.objectPosition='center center';
              });
            }
            function apply(){stylePick();patchPlayerCards();}
            window.addEventListener('load',apply); setInterval(apply,700);
          })();
          JS
      - name: Commit image fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add characters
          git diff --cached --quiet && exit 0
          git commit -m 'Build separate character images'
          git push
