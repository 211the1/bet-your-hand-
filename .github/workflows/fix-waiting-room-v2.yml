name: Fix waiting room v2

on:
  push:
    branches: [main]

jobs:
  fix:
    if: github.event.head_commit.message != 'Apply waiting room v2'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix player photos and host full-screen waiting room
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          old="d.className='player '+(i===state.turn?'active':'');"
          new="d.className='player '+(i===state.turn?'active':''); d.dataset.character=p.character||'';"
          if old in s:
              s=s.replace(old,new,1)

          old_css='.wrap{max-width:1150px;margin:auto;padding:14px}'
          new_css='.wrap{width:100%;max-width:none;min-height:100vh;margin:0;padding:14px}'
          if old_css in s:
              s=s.replace(old_css,new_css,1)

          old_player='.player{border:2px solid #4031b9;border-radius:15px;padding:10px;background:#09083b}'
          new_player='.player{border:2px solid #4031b9;border-radius:15px;padding:10px;background:#09083b;min-height:145px}'
          if old_player in s:
              s=s.replace(old_player,new_player,1)

          marker='@media(max-width:700px){'
          extra='.hostView #room{min-height:calc(100vh - 170px);display:flex;flex-direction:column;justify-content:center}.hostView #players{flex:1;align-content:center}.hostView #room .roomcode{font-size:clamp(42px,8vw,78px)}.hostView #room .player{min-height:190px}.hostView #room .player .playerCharImg{width:min(150px,14vw);height:min(150px,14vw);border-radius:18px;margin:auto auto 8px}.hostView #room .player .name,.hostView #room .player .small,.hostView #room .player .coins{text-align:center;display:block}'
          if extra not in s:
              s=s.replace(marker,extra+marker,1)

          old_role="const isPlayer=mode==='player';\n  $('roleHeader').classList.toggle('hidden', false);"
          new_role="const isPlayer=mode==='player';\n  document.body.classList.toggle('hostView',!isPlayer);\n  $('roleHeader').classList.toggle('hidden', false);"
          if old_role in s:
              s=s.replace(old_role,new_role,1)

          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/fix-waiting-room-v2.yml
          git commit -m 'Apply waiting room v2'
          git push
