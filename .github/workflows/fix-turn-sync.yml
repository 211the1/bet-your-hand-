name: Fix turn synchronization
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-turn-sync.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply turn protection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('server.js')
          s=p.read_text()
          old="function awardStart(r){const p=r.players[r.turn];if(p&&r.phase==='playing'&&!r.pending&&hasPlayable(r,p)){p.points+=150;log(r,`${p.name} earned +150 for starting with a playable card.`)}}\nfunction advance(r,steps=1){const n=r.players.length;if(!n)return;r.turn=(r.turn+r.direction*steps+n*100)%n;awardStart(r)}\nfunction deal(r){r.deck=deck();r.discard=[];r.pending=null;r.pendingColor=null;r.direction=1;r.turn=0;r.winner=null;for(const p of r.players){p.hand=[];for(let i=0;i<8;i++)drawOne(r,p)}"
          new="function awardStart(r){const p=r.players[r.turn];if(!p||r.phase!=='playing'||r.pending||r.turnAwarded===r.turnSerial)return;if(hasPlayable(r,p)){p.points+=150;r.turnAwarded=r.turnSerial;log(r,`${p.name} earned +150 for starting with a playable card.`)}}\nfunction advance(r,steps=1){const n=r.players.length;if(!n)return;const from=r.turn;r.turn=(r.turn+r.direction*steps+n*100)%n;r.turnSerial=(r.turnSerial||0)+1;r.turnAwarded=-1;log(r,`TURN: ${r.players[from]?.name||'Player'} -> ${r.players[r.turn]?.name||'Player'}.`);awardStart(r)}\nfunction deal(r){r.deck=deck();r.discard=[];r.pending=null;r.pendingColor=null;r.direction=1;r.turn=0;r.turnSerial=(r.turnSerial||0)+1;r.turnAwarded=-1;r.winner=null;for(const p of r.players){p.hand=[];p.lastCardBonus=null;for(let i=0;i<8;i++)drawOne(r,p)}"
          if old not in s: raise SystemExit('Expected turn block not found')
          s=s.replace(old,new,1)
          old2="phase:'lobby',round:1,turn:0,direction:1,players:[],deck:[],discard:[],pending:null,pendingColor:null,winner:null,log:[]"
          new2="phase:'lobby',round:1,turn:0,direction:1,turnSerial:0,turnAwarded:-1,players:[],deck:[],discard:[],pending:null,pendingColor:null,winner:null,log:[]"
          if old2 not in s: raise SystemExit('Expected room state block not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Improve sync polling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('server.js')
          s=p.read_text()
          s=s.replace('setInterval(syncNow,3000)','setInterval(syncNow,1000)',1)
          p.write_text(s)
          PY
      - name: Commit fix and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js
          git rm .github/workflows/fix-turn-sync.yml
          git commit -m 'Fix turn synchronization and duplicate start bonus'
          git push
