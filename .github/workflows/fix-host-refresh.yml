name: Fix Host Refresh
on:
  push:

jobs:
  patch:
    if: ${{ github.event.head_commit.message == 'Fix host refresh role persistence' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Keep host role after refresh
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="let mode='player';"
          new="let mode=localStorage.getItem('byhMode')||'player';"
          if old not in s:
              raise SystemExit('mode declaration not found')
          s=s.replace(old,new,1)
          marker="if(new URLSearchParams(location.search).has('host')) mode='host';"
          if marker not in s:
              raise SystemExit('host query marker not found')
          s=s.replace(marker,"if(new URLSearchParams(location.search).has('host')) mode='host';\nif(mode!=='host' && mode!=='player') mode='player';",1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix host refresh role persistence" || exit 0
          git push
