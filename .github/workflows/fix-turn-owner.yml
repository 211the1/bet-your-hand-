name: Fix authoritative turn owner
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-turn-owner.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make turn owner authoritative
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('server.js')
          s=p.read_text()
          old="function advance(r,steps=1){const n=r.players.length;if(!n)return;const from=r.turn;r.turn=(r.turn+r.direction*steps+n*100)%n;r.turnSerial=(r.turnSerial||0)+1;r.turnAwarded=-1;log(r,`TURN: ${r.players[from]?.name||'Player'} -> ${r.players[r.turn]?.name||'Player'}.`);awardStart(r)}"
          new="function currentPlayer(r){return r.players.find(p=>p.id===r.turnPlayerId)||r.players[r.turn]}\nfunction advance(r,steps=1){const n=r.players.length;if(!n)return;const from=currentPlayer(r),fromIndex=r.players.indexOf(from);let targetIndex=(fromIndex+r.direction*steps+n*100)%n;r.turnPlayerId=r.players[targetIndex].id;r.turn=targetIndex;r.turnSerial=(r.turnSerial||0)+1;r.turnAwarded=-1;log(r,`TURN: ${from?.name||'Player'} -> ${r.players[targetIndex]?.name||'Player'}.`);awardStart(r)}"
          if old not in s: raise SystemExit('advance block not found')
          s=s.replace(old,new,1)
          s=s.replace("function awardStart(r){const p=r.players[r.turn];", "function awardStart(r){const p=currentPlayer(r);")
          s=s.replace("r.direction=1;r.turn=0;r.turnSerial=(r.turnSerial||0)+1;", "r.direction=1;r.turn=0;r.turnPlayerId=r.players[0]?.id||null;r.turnSerial=(r.turnSerial||0)+1;",1)
          s=s.replace("if(r.players[r.turn]?.id!==p.id)", "if(currentPlayer(r)?.id!==p.id)")
          old_room="turnSerial:0,turnAwarded:-1,players:[]"
          new_room="turnSerial:0,turnAwarded:-1,turnPlayerId:null,players:[]"
          if old_room not in s: raise SystemExit('room block not found')
          s=s.replace(old_room,new_room,1)
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js
          git rm .github/workflows/fix-turn-owner.yml
          git commit -m 'Make turn ownership authoritative by player ID'
          git push
