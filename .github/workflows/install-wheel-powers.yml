name: Implement wheel powers

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update game rules
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('server.js')
          s=p.read_text()

          old=re.search(r"const WHEEL=\[.*?\];",s)
          new="const WHEEL=[{name:'Bug',power:'EXTRA PLAY',color:'Royal Blue'},{name:'Face',power:'SHIELD',color:'Deep Purple'},{name:'Ling Ling',power:'COLOR CHOICE',color:'Emerald'},{name:'Beanz',power:'EXTRA PLAY',color:'Gold'},{name:'The One',power:'TURN SWITCH',color:'Royal Blue'},{name:'Boone',power:'SHIELD',color:'Emerald'},{name:'Chicken Joe',power:'COLOR CHOICE',color:'Deep Purple'},{name:'Juby',power:'EXTRA PLAY',color:'Gold'},{name:'Meemaw',power:'TURN SWITCH',color:'Royal Blue'}];"
          if not old: raise SystemExit('WHEEL constant not found')
          s=s[:old.start()]+new+s[old.end():]

          s=s.replace("winnerId:winnerId}:null,activeColor", "winnerId:winnerId,power:r.pending.power||null}:null,activeColor")
          s=s.replace("points:p.points,handCount:p.hand.length,connected:!!p.ws", "points:p.points,handCount:p.hand.length,power:p.power||null,connected:!!p.ws")

          old_play=re.search(r"function play\(r,p,i\)\{.*?\n\}function betTimeout",s,re.S)
          if not old_play: raise SystemExit('play block not found')
          new_play="""function play(r,p,i){if(r.phase!=='playing'||r.pending)return send(p.ws,{type:'toast',text:'Finish the current action first.'});if(currentPlayer(r)?.id!==p.id)return send(p.ws,{type:'toast',text:'It is not your turn.'});const c=p.hand[i];if(!c)return;if(!playable(r,c))return send(p.ws,{type:'toast',text:'That card cannot be played.'});p.hand.splice(i,1);r.discard.push(c);log(r,`${p.name} played ${c.action==='BET'?'BET YOUR HAND':c.action||c.ch}.`);if(p.lastCardBonus){const b=p.lastCardBonus;p.lastCardBonus=null;p.points+=b;log(r,`${p.name} completed LAST CARD and earned +${b} bonus points.`)}if(p.hand.length===0)return finish(r,p);if(c.action==='WILD'){r.pending={type:'color',playerId:p.id,playerName:p.name,power:p.extraPlay?'EXTRA PLAY':null};p.extraPlay=0;broadcast(r);return}if(c.action==='BET'){p.extraPlay=0;r.pending={type:'wheel',playerId:p.id,playerName:p.name,wheel:null,power:null};log(r,`${p.name} played BET YOUR HAND. The character power wheel is spinning.`);broadcast(r);setTimeout(()=>resolveWheel(r.code),2200);return}if(p.extraPlay){p.extraPlay=0;log(r,`${p.name} used EXTRA PLAY.`);broadcast(r);return}r.pendingColor=null;let steps=1;if(c.action==='SKIP')steps=2;if(c.action==='REVERSE'){r.direction*=-1;if(r.players.length===2)steps=2}advance(r,steps);broadcast(r)}
function resolveWheel(code){const r=rooms.get(code);if(!r||!r.pending||r.pending.type!=='wheel')return;const p=r.players.find(x=>x.id===r.pending.playerId);if(!p)return;const wheel=WHEEL[Math.floor(Math.random()*WHEEL.length)];r.pending={type:'wheel',playerId:p.id,playerName:p.name,wheel:wheel.name,wheelColor:wheel.color,power:wheel.power,winnerId:p.id};log(r,`${p.name}'s wheel landed on ${wheel.name}: ${wheel.power}.`);broadcast(r);setTimeout(()=>{const x=rooms.get(code);if(!x||!x.pending||x.pending.type!=='wheel')return;const q=x.players.find(z=>z.id===x.pending.playerId);if(!q)return;const power=x.pending.power;x.pending=null;if(power==='EXTRA PLAY'){q.extraPlay=1;q.power='EXTRA PLAY';log(x,`${q.name} received EXTRA PLAY. They may play one additional card.`);broadcast(x);return}if(power==='SHIELD'){q.shield=1;q.power='SHIELD';log(x,`${q.name} received SHIELD. The next Skip effect against them is blocked.`);advance(x,1);broadcast(x);return}if(power==='TURN SWITCH'){x.direction*=-1;q.power='TURN SWITCH';log(x,`${q.name} activated TURN SWITCH. Play direction reversed.`);advance(x,1);broadcast(x);return}if(power==='COLOR CHOICE'){q.power='COLOR CHOICE';x.pending={type:'color',playerId:q.id,playerName:q.name,power:'COLOR CHOICE'};log(x,`${q.name} received COLOR CHOICE. Choose the next color.`);broadcast(x);return}advance(x,1);broadcast(x)},1800)}
function betTimeout"""
          s=s[:old_play.start()]+new_play+s[old_play.end():]

          # Remove the old wager/challenge implementation by making its entry points harmless.
          s=re.sub(r"function betTimeout\(code\)\{.*?\n\}function challenge", "function betTimeout(code){}function challenge", s, flags=re.S)
          s=re.sub(r"function challenge\(r,p,amount\)\{.*?\n\}function resolveChallenge", "function challenge(r,p,amount){send(p.ws,{type:'toast',text:'Challenges are not used. The wheel now awards a character power.'})}function resolveChallenge", s, flags=re.S)
          s=re.sub(r"function resolveChallenge\(code\)\{.*?\n\}function color", "function resolveChallenge(code){}function color", s, flags=re.S)

          # Player state fields.
          s=s.replace("lastCardBonus:null};r.players.push(p)", "lastCardBonus:null,power:null,shield:0,extraPlay:0};r.players.push(p)")
          s=s.replace("p.hand=[];p.lastCardBonus=null;for(let i=0;i<8;i++)drawOne(r,p)", "p.hand=[];p.lastCardBonus=null;p.power=null;p.shield=0;p.extraPlay=0;for(let i=0;i<8;i++)drawOne(r,p)")

          # Shield blocks a Skip effect on the player who would be skipped.
          s=s.replace("const from=currentPlayer(r),fromIndex=r.players.indexOf(from);let targetIndex=(fromIndex+r.direction*steps+n*100)%n;r.turnPlayerId=r.players[targetIndex].id", "const from=currentPlayer(r),fromIndex=r.players.indexOf(from);let targetIndex=(fromIndex+r.direction*steps+n*100)%n;if(steps===2&&r.players[targetIndex]?.shield){const blocked=r.players[targetIndex];blocked.shield=0;blocked.power=null;log(r,`${blocked.name} used SHIELD to block the Skip.`);steps=1;targetIndex=(fromIndex+r.direction*steps+n*100)%n}r.turnPlayerId=r.players[targetIndex].id")

          # Color choice consumes its power after the player chooses.
          s=s.replace("r.pendingColor=c;r.pending=null;log(r,`${p.name} chose ${c.toUpperCase()}.`);advance(r,1);broadcast(r)", "r.pendingColor=c;const hadPower=r.pending.power==='COLOR CHOICE';r.pending=null;if(hadPower)p.power=null;log(r,`${p.name} chose ${c.toUpperCase()}.`);advance(r,1);broadcast(r)")

          p.write_text(s)

          # Remove old wager UI and add a simple power display hook.
          q=Path('index.html')
          h=q.read_text()
          h=re.sub(r"<button id=\"betBtn\".*?</button>", "", h, flags=re.S)
          h=re.sub(r"<div id=\"betPanel\".*?</div>\n\n<div id=\"challengePanel\".*?</div>", "", h, flags=re.S)
          h=h.replace("<div id=\"wheelPanel\" class=\"modalbg hidden\">\n<div class=\"modal\">\n<h2>🎡 BET YOUR HAND WHEEL</h2>\n<p id=\"wheelText\">Challenge result</p>", "<div id=\"wheelPanel\" class=\"modalbg hidden\">\n<div class=\"modal\">\n<h2>🎡 BET YOUR HAND WHEEL</h2>\n<p id=\"wheelText\">Character Power Spin</p>")
          q.write_text(h)
          PY

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js index.html
          git diff --cached --quiet || git commit -m 'Replace wager challenge with four wheel powers'
          git push
