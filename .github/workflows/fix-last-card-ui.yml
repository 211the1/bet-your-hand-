name: Fix LAST CARD UI
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-last-card-ui.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix active LAST CARD button
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="var show=mode==='player'&&turn&&h.length===1&&!lastCardActive&&!(state&&state.pending)&&state&&state.phase==='playing';"
          new="var show=mode==='player'&&turn&&h.length===1&&!(state&&state.pending)&&state&&state.phase==='playing';"
          if old not in s:
              raise SystemExit('Expected LAST CARD line not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit fix and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/fix-last-card-ui.yml
          git commit -m 'Keep LAST CARD button visible after activation'
          git push
