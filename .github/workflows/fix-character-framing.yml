name: Fix Character Framing
on:
  push:
    branches: [main]

jobs:
  fix:
    if: github.event.head_commit.message == 'Fix character face framing'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove forced crop and keep exact centered sprite cells
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('characters/character-images.js')
          s=p.read_text()
          old="im.style.backgroundPosition=(pos[ch]||'50% 50%').replace(/ (\\d+)%$/, ' 22%');"
          new="im.style.backgroundPosition=(pos[ch]||'50% 50%');"
          if old not in s:
            raise SystemExit('Expected character framing line was not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add characters/character-images.js
          git commit -m "Fix character face framing"
          git push
