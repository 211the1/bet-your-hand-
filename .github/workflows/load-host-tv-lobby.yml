name: Load Host TV lobby

on:
  push:
    branches: [main]

jobs:
  load:
    if: github.event.head_commit.message != 'Load Host TV lobby'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Load lobby script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="/host-tv-lobby.js"></script>\n'
          if tag not in s:
              s=s.replace('</body>',tag+'</body>',1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/load-host-tv-lobby.yml
          git commit -m 'Load Host TV lobby'
          git push
