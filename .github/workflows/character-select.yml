name: Add Character Selection

on:
  push:
    branches: [main]

jobs:
  patch:
    if: github.event.head_commit.message == 'Add character selection'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch character selection
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server.js')
          s=p.read_text()
          old="players:r.players.map(p=>({id:p.id,name:p.name,points:p.points,handCount:p.hand.length,connected:!!p.ws}))"
          new="players:r.players.map(p=>({id:p.id,name:p.name,character:p.character||null,points:p.points,handCount:p.hand.length,connected:!!p.ws}))"
          if old not in s: raise SystemExit('server pub pattern not found')
          s=s.replace(old,new,1)
          old="function join(ws,code,name){const r=rooms.get(code);"
          new="function join(ws,code,name,character){const r=rooms.get(code);"
          if old not in s: raise SystemExit('server join signature not found')
          s=s.replace(old,new,1)
          old="name=name||'Player';if(r.players.some(p=>p.name.toLowerCase()===name.toLowerCase()))return send(ws,{type:'error',text:'That player name is already in use.'});const p={id:id(),token:makeToken(),name,points:500"
          new="name=name||'Player';if(!CHARS.includes(character))return send(ws,{type:'error',text:'Choose a character first.'});if(r.players.some(p=>p.name.toLowerCase()===name.toLowerCase()))return send(ws,{type:'error',text:'That player name is already in use.'});if(r.players.some(p=>p.character===character))return send(ws,{type:'error',text:'That character is already taken. Choose another character.'});const p={id:id(),token:makeToken(),name,character,points:500"
          if old not in s: raise SystemExit('server join body pattern not found')
          s=s.replace(old,new,1)
          old="if(m.type==='join'){if(!ws.role)join(ws,String(m.code||'').replace(/\\D/g,'').slice(0,4),String(m.name||'Player').trim().slice(0,16));return}"
          new="if(m.type==='join'){if(!ws.role)join(ws,String(m.code||'').replace(/\\D/g,'').slice(0,4),String(m.name||'Player').trim().slice(0,16),String(m.character||''));return}"
          if old not in s: raise SystemExit('server join handler pattern not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          css=".charGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.charPick{min-height:72px;border:2px solid #4031b9;border-radius:14px;background:#09083b;color:#fff;padding:8px;font-weight:900;cursor:pointer}.charPick.selected{border-color:#ffd21c;box-shadow:0 0 14px #ffd21c66;background:#17104f}.charPick:disabled{opacity:.45;cursor:not-allowed}.charName{display:block;font-size:14px}@media(max-width:700px){.charGrid{grid-template-columns:repeat(2,1fr)}}\n"
          marker=".connection{display:inline-block;padding:6px 10px;border-radius:10px;font-weight:900}"
          if marker not in s: raise SystemExit('index css marker not found')
          s=s.replace(marker,marker+css,1)
          marker='<p class="small">Your cards stay private on your phone. If the connection drops, the game will try to reconnect.</p>'
          insert='<h3>Choose Your Character</h3><div id="charChoices" class="charGrid"></div><div id="charSelected" class="small center">Choose 1 of the 9 characters before joining.</div>\n'
          if marker not in s: raise SystemExit('index player setup marker not found')
          s=s.replace(marker,insert+marker,1)
          marker="const COLORS=['red','blue','green','yellow'];"
          insert="const CHARACTERS=['Bug','Face','Ling Ling','Beanz','The One','Boone','Chicken Joe','Juby','Meemaw'];\nlet selectedCharacter='';\n"
          if marker not in s: raise SystemExit('index colors marker not found')
          s=s.replace(marker,marker+insert,1)
          marker="applyRoleUI();\n\nfunction toast(t){"
          insert="applyRoleUI();\nrenderCharacterChoices();\n\nfunction renderCharacterChoices(){\n  const box=$('charChoices'); if(!box)return; box.innerHTML='';\n  const taken=new Set((state?.players||[]).map(p=>p.character).filter(Boolean));\n  CHARACTERS.forEach(ch=>{\n    const b=document.createElement('button'); b.type='button'; b.className='charPick'+(selectedCharacter===ch?' selected':''); b.disabled=taken.has(ch);\n    const n=document.createElement('span'); n.className='charName'; n.textContent=ch; b.appendChild(n);\n    if(taken.has(ch)){const small=document.createElement('span');small.className='small';small.textContent='TAKEN';b.appendChild(small)}\n    b.addEventListener('click',()=>{selectedCharacter=ch;renderCharacterChoices();$('charSelected').textContent='Selected: '+ch;});\n    box.appendChild(b);\n  });\n}\n\nfunction toast(t){"
          if marker not in s: raise SystemExit('index init marker not found')
          s=s.replace(marker,insert,1)
          marker="function joinRoom(){"
          if marker not in s: raise SystemExit('index joinRoom marker not found')
          # Inject validation/send argument into the existing joinRoom without replacing its body.
          s=s.replace(marker,"function joinRoom(){\n  if(!selectedCharacter){toast('Choose a character first.');return;}\n",1)
          marker="send({type:'join',code:roomCode,name:myName});"
          if marker not in s: raise SystemExit('index join send marker not found')
          s=s.replace(marker,"send({type:'join',code:roomCode,name:myName,character:selectedCharacter});",1)
          # If state updates in the lobby, refresh taken-character buttons.
          marker="state=msg.state;"
          if marker in s: s=s.replace(marker,marker+"\n    if(state?.phase==='lobby')renderCharacterChoices();",1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js index.html
          git commit -m 'Add character selection' || exit 0
          git push
