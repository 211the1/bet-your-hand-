name: Apply end-game bonus rules
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-endgame-bonuses.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch server
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('server.js')
          s=p.read_text()
          if 'ENDGAME_BONUS_PATCH_V1' in s:
              raise SystemExit('already patched')
          s=s.replace("function pub(r){return{", "// ENDGAME_BONUS_PATCH_V1\nfunction privateState(p){return{bonus2:p.bonus2||null,lastShot:p.lastShot||null}}\nfunction pub(r){return{")
          s=s.replace("function broadcast(r){send(r.host,{type:'state',state:pub(r),log:r.log});for(const p of r.players)send(p.ws,{type:'state',state:pub(r),hand:p.hand,me:p.id,log:r.log})}", "function broadcast(r){send(r.host,{type:'state',state:pub(r),log:r.log});for(const p of r.players)send(p.ws,{type:'state',state:pub(r),hand:p.hand,me:p.id,log:r.log,...privateState(p)})}")
          s=s.replace("else if(p)send(ws,{type:'state',state:pub(r),hand:p.hand,me:p.id,log:r.log})", "else if(p)send(ws,{type:'state',state:pub(r),hand:p.hand,me:p.id,log:r.log,...privateState(p)})")
          s=s.replace("p.hand.splice(i,1);r.discard.push(c);log(r,`${p.name} played ${c.action==='BET'?'BET YOUR HAND':c.action||c.ch}.`);if(p.hand.length===0)", "p.hand.splice(i,1);r.discard.push(c);log(r,`${p.name} played ${c.action==='BET'?'BET YOUR HAND':c.action||c.ch}.`);if(p.bonus2){const amount=p.bonus2;p.bonus2=null;p.points+=amount;log(r,`${p.name} completed BET YOUR HAND and earned +${amount} bonus points.`)}if(p.lastShot){const amount=p.lastShot;p.lastShot=null;p.points+=amount;log(r,`${p.name} completed LAST CARD and earned +${amount} bonus points.`)}if(p.hand.length===0)")
          s=s.replace("if(hasColorOrCharacterMatch(r,p))return send(p.ws,{type:'toast',text:'You have a card matching the current color or character.'});let count=0;", "if(hasColorOrCharacterMatch(r,p))return send(p.ws,{type:'toast',text:'You have a card matching the current color or character.'});p.bonus2=null;p.lastShot=null;let count=0;")
          marker="function roomCode(){let c;"
          funcs="""function bonus2(r,p,amount){if(r.phase!=='playing'||r.pending)return send(p.ws,{type:'toast',text:'Finish the current action first.'});if(r.players[r.turn]?.id!==p.id)return send(p.ws,{type:'toast',text:'It is not your turn.'});if(p.hand.length!==2)return send(p.ws,{type:'toast',text:'BET YOUR HAND is available only at exactly 2 cards.'});if(p.bonus2||p.lastShot)return send(p.ws,{type:'toast',text:'You already activated an end-game bonus.'});amount=Math.floor(Number(amount)||0);if(amount<50)return send(p.ws,{type:'toast',text:'Choose at least 50 bonus points.'});amount=Math.min(amount,1000);p.bonus2=amount;log(r,`${p.name} activated BET YOUR HAND for a possible +${amount} bonus.`);send(p.ws,{type:'bonus2Placed',amount});broadcast(r)}\nfunction lastCard(r,p,amount){if(r.phase!=='playing'||r.pending)return send(p.ws,{type:'toast',text:'Finish the current action first.'});if(r.players[r.turn]?.id!==p.id)return send(p.ws,{type:'toast',text:'It is not your turn.'});if(p.hand.length!==1)return send(p.ws,{type:'toast',text:'LAST CARD is available only at 1 card.'});if(p.bonus2||p.lastShot)return send(p.ws,{type:'toast',text:'You already activated an end-game bonus.'});amount=Math.floor(Number(amount)||0);if(![100,250,500].includes(amount))return send(p.ws,{type:'toast',text:'Choose SAFE, BOLD, or BIG.'});p.lastShot=amount;log(r,`${p.name} activated LAST CARD for a possible +${amount} bonus.`);send(p.ws,{type:'lastCardPlaced',amount});broadcast(r)}\n"""
          s=s.replace(marker,funcs+marker)
          s=s.replace("hand:[],ws,disconnectedAt:null,timer:null};", "hand:[],ws,disconnectedAt:null,timer:null,bonus2:null,lastShot:null};")
          s=s.replace("else if(m.type==='bet')challenge(r,p,m.amount);else if(m.type==='color')color(r,p,m.color)", "else if(m.type==='bet')challenge(r,p,m.amount);else if(m.type==='bonus2')bonus2(r,p,m.amount);else if(m.type==='lastCard')lastCard(r,p,m.amount);else if(m.type==='color')color(r,p,m.color)")
          css="<style>.bonus-active{border-color:#ffd21c!important;box-shadow:0 0 20px #ffd21c99!important}.last-card-btn{background:linear-gradient(135deg,#f3bd18,#ff7b00)!important;color:#17110b!important;border-color:#ffd21c!important}</style>"
          js="""<script>(function(){
function sendBonus(type,amount){if(!ws||ws.readyState!==WebSocket.OPEN){toast('Not connected yet. Reconnecting…');return}send({type:type,amount:amount})}
function ensureLastModal(){if(document.getElementById('lastCardPanel'))return;var d=document.createElement('div');d.id='lastCardPanel';d.className='modalbg hidden';d.innerHTML='<div class=\\"modal\\"><h2>🔥 LAST CARD</h2><p>One card left. Choose a bonus. Successfully play your final card to earn it.</p><div class=\\"actions\\"><button class=\\"btn\\" onclick=\\"sendLast(100)\\">SAFE<br>+100</button><button class=\\"btn primary\\" onclick=\\"sendLast(250)\\">BOLD<br>+250</button><button class=\\"btn last-card-btn\\" onclick=\\"sendLast(500)\\">BIG<br>+500</button></div><div class=\\"actions\\"><button class=\\"btn\\" onclick=\\"closeLast()\\">CANCEL</button></div></div>';document.body.appendChild(d)}
window.openBet=function(){var h=window.myHand||[];if(h.length!==2){toast('BET YOUR HAND appears when you have exactly 2 cards.');return}if(window.myBonus2){toast('BET YOUR HAND bonus is already active.');return}betAmount=50;updateBet();var p=document.getElementById('betPanel');if(p){p.querySelector('h2').textContent='🔥 BET YOUR HAND BONUS';var x=p.querySelector('p');if(x)x.textContent='You have 2 cards. Choose a bonus. Successfully play your next card to earn it.';var b=p.querySelector('.primary.big');if(b)b.textContent='ACTIVATE BONUS';p.classList.remove('hidden')}};
window.sendBet=function(){sendBonus('bonus2',betAmount)};
window.sendLast=function(a){closeLast();sendBonus('lastCard',a)};
window.closeLast=function(){var p=document.getElementById('lastCardPanel');if(p)p.classList.add('hidden')};
window.openLast=function(){ensureLastModal();if((window.myHand||[]).length!==1){toast('LAST CARD appears when you have exactly 1 card.');return}if(window.myLastShot){toast('LAST CARD bonus is already active.');return}document.getElementById('lastCardPanel').classList.remove('hidden')};
function syncBonusUI(){var h=window.myHand||[],turn=state&&state.players&&state.players[state.turn]&&state.players[state.turn].id===myId,b=document.getElementById('betBtn');if(b){b.textContent=window.myBonus2?'BET BONUS ACTIVE':'BET YOUR HAND';b.classList.toggle('bonus-active',!!window.myBonus2);b.disabled=!turn||h.length!==2||!!state.pending||!!window.myBonus2}ensureLastModal();var wrap=document.querySelector('#playerGameArea .actions');if(wrap){var l=document.getElementById('lastCardBtn');if(!l){l=document.createElement('button');l.id='lastCardBtn';l.className='btn big last-card-btn';l.onclick=openLast;wrap.appendChild(l)}l.classList.toggle('hidden',h.length!==1);l.disabled=!turn||h.length!==1||!!state.pending||!!window.myLastShot;l.textContent=window.myLastShot?'LAST CARD ACTIVE':'🔥 LAST CARD';l.classList.toggle('bonus-active',!!window.myLastShot)}}
var oldHandle=window.handle;window.handle=function(m){if(m&&(m.type==='state'||m.type==='welcome'||m.type==='playerResumed')){if(m.bonus2!==undefined)window.myBonus2=m.bonus2||null;if(m.lastShot!==undefined)window.myLastShot=m.lastShot||null}if(m&&m.type==='bonus2Placed'){window.myBonus2=m.amount||null;closeBet();toast('BET YOUR HAND BONUS ACTIVE: +'+Number(m.amount||0).toLocaleString())}if(m&&m.type==='lastCardPlaced'){window.myLastShot=m.amount||null;toast('LAST CARD ACTIVE: +'+Number(m.amount||0).toLocaleString())}if(oldHandle)oldHandle(m);if(m&&m.type==='state')setTimeout(syncBonusUI,0)};
var n=0,t=setInterval(function(){if(typeof render==='function'){var oldRender=render;window.render=function(){oldRender.apply(this,arguments);syncBonusUI()};clearInterval(t);ensureLastModal();syncBonusUI()}if(++n>100)clearInterval(t)},50);
setInterval(function(){if(ws&&ws.readyState===WebSocket.OPEN)send({type:'sync'})},3000);document.addEventListener('visibilitychange',function(){if(!document.hidden&&ws&&ws.readyState===WebSocket.OPEN)send({type:'sync'})});
})();</script>"""
          patch=css+js
          s=s.replace('</body>',patch+'\\n</body>')
          p.write_text(s)
          PY
          node --check server.js
      - name: Commit patched server
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js
          git commit -m 'Reset end-game bonus rules' || exit 0
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/apply-endgame-bonuses.yml
          git commit -m 'Remove temporary end-game patch workflow'
          git push
