name: Publish site with PLAY YOUR HAND app shell
# Re-publish after scanner toolbar interaction fix on fresh-rebuild.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-site-with-app-shell.yml'
      - 'app-shell/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out currently published main site
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Check out fresh-rebuild branch
        uses: actions/checkout@v4
        with:
          ref: fresh-rebuild
          path: source

      - name: Add scanner shell without replacing the main site files
        run: |
          mkdir -p site/app-shell
          cp -R source/app-shell/. site/app-shell/
          # Publish host scanner icon assets.
          mkdir -p site/host
          cp source/host/host-icon-192.png source/host/host-icon-512.png site/host/
          # Publish a separate player scanner app without changing the game screens.
          mkdir -p site/player-shell
          cp -R source/player-shell/. site/player-shell/
          # Publish the player app icons referenced by its manifest.
          cp source/pwa-icon-192.png source/pwa-icon-512.png site/
          touch site/.nojekyll

      - name: Verify scanner files are in the published artifact
        run: |
          test -f site/app-shell/index.html
          test -f site/app-shell/shell.js
          test -f site/app-shell/shell.css
          test -f site/app-shell/manifest.webmanifest
          test -f site/host/host-icon-192.png
          test -f site/host/host-icon-512.png
          test -f site/player-shell/index.html
          test -f site/player-shell/shell.js
          test -f site/player-shell/shell.css
          test -f site/player-shell/manifest.webmanifest
          test -f site/player-shell/sw.js
          test -f site/pwa-icon-192.png
          test -f site/pwa-icon-512.png
          echo "Verified scanner files:"
          find site/app-shell -maxdepth 1 -type f -printf '%f\n' | sort
          echo "Published site root:"
          ls -la site | head -40

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

