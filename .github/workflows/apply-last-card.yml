name: Apply LAST CARD rule

on:
  push:
    paths:
      - '.github/workflows/apply-last-card.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch game files
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          s = index.read_text()
          if 'BYH_LAST_CARD_PATCH' in s:
              raise SystemExit('LAST CARD patch already present')

          patch = r'''<!-- BYH_LAST_CARD_PATCH -->
          <script>
          (function(){
            var lastCardActive=false,lastCardAmount=0;
            function ensureLastCardUI(){
              var old=document.getElementById('betBtn'); if(old) old.classList.add('hidden');
              var area=document.querySelector('#playerGameArea .actions');
              if(area && !document.getElementById('lastCardBtn')){
                var b=document.createElement('button');
                b.id='lastCardBtn'; b.className='btn primary big hidden'; b.type='button';
                b.textContent='🔥 LAST CARD'; b.onclick=openLastCard; area.appendChild(b);
              }
              if(!document.getElementById('lastCardPanel')){
                var bg=document.createElement('div'); bg.id='lastCardPanel'; bg.className='modalbg hidden';
                bg.innerHTML='<div class="modal"><h2>🔥 LAST CARD</h2><p>Choose your fictional game-point bonus before playing your final card.</p><div class="actions"><button class="btn big" onclick="sendLastCard(100)">SAFE +100</button><button class="btn big" onclick="sendLastCard(250)">BOLD +250</button><button class="btn primary big" onclick="sendLastCard(500)">BIG +500</button></div><div class="actions"><button class="btn" onclick="closeLastCard()">CANCEL</button></div></div>';
                document.body.appendChild(bg);
              }
            }
            function refreshLastCard(){
              ensureLastCardUI();
              var h=window.myHand||[],b=document.getElementById('lastCardBtn'); if(!b)return;
              if(h.length!==1)lastCardActive=false;
              var turn=state&&state.players&&state.players[state.turn]&&state.players[state.turn].id===myId;
              var show=mode==='player'&&turn&&h.length===1&&!lastCardActive&&!(state&&state.pending)&&state&&state.phase==='playing';
              b.classList.toggle('hidden',!show); b.disabled=!show;
              b.textContent=lastCardActive?'🔥 LAST CARD +'+lastCardAmount+' ACTIVE':'🔥 LAST CARD';
            }
            window.openLastCard=function(){
              refreshLastCard();
              var h=window.myHand||[];
              if(h.length!==1){toast('LAST CARD is available only with 1 card.');return;}
              if(lastCardActive){toast('LAST CARD bonus is already active.');return;}
              document.getElementById('lastCardPanel').classList.remove('hidden');
            };
            window.closeLastCard=function(){var x=document.getElementById('lastCardPanel');if(x)x.classList.add('hidden');};
            window.sendLastCard=function(amount){amount=Number(amount);if([100,250,500].indexOf(amount)<0)return;send({type:'lastCard',amount:amount});closeLastCard();};
            var oldRender=render;
            render=function(){oldRender.apply(this,arguments);refreshLastCard();};
            var oldHandle=handle;
            handle=function(m){
              if(m&&m.type==='lastCardPlaced'){lastCardActive=true;lastCardAmount=Number(m.amount)||0;toast('LAST CARD bonus activated: +'+lastCardAmount);}
              oldHandle.apply(this,arguments);refreshLastCard();
            };
            window.addEventListener('load',function(){refreshLastCard();});
            setInterval(refreshLastCard,500);
          })();
          </script>
          '''

          s=s.replace('</body>',patch+'\n</body>',1)
          index.write_text(s)

          # The server already contains the LAST CARD game rule. No second 2-card bonus is added.
          server=Path('server.js').read_text()
          if 'function lastCard(r,p,amount)' not in server:
              raise SystemExit('server LAST CARD rule missing')
          if 'bonus2' in server:
              raise SystemExit('unexpected 2-card bonus code found')
          PY

      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/apply-last-card.yml
          git commit -m 'Replace 2-card mechanic with LAST CARD'
          git push
