name: Show player characters
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.event.head_commit.message == 'Show player characters'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add character to player cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="""d.innerHTML=\n      '<div class=\"name\">'+escapeHtml(p.name)+'</div>'+\n      '<div class=\"coins\">⭐ '+Number(p.points).toLocaleString()+'</div>'+\n      '<div class=\"small\">'+p.handCount+' cards'+\n      (p.connected===false?' • reconnecting…':'')+\n      '</div>';"""
          new="""d.innerHTML=\n      '<div class=\"name\">'+escapeHtml(p.name)+'</div>'+\n      '<div class=\"small\">'+escapeHtml(p.character||'No character')+'</div>'+\n      '<div class=\"coins\">⭐ '+Number(p.points).toLocaleString()+'</div>'+\n      '<div class=\"small\">'+p.handCount+' cards'+\n      (p.connected===false?' • reconnecting…':'')+\n      '</div>';"""
          if old not in s:
              raise SystemExit('render block not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Show player characters" || exit 0
          git push