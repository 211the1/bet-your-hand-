name: Connect Host TV waiting room

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Host TV loader is cache-busted
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          if 'src="/host-tv-lobby.js"' in s:
              s = s.replace('src="/host-tv-lobby.js"', 'src="/host-tv-lobby.js?v=2"')
          elif "src='/host-tv-lobby.js'" in s:
              s = s.replace("src='/host-tv-lobby.js'", "src='/host-tv-lobby.js?v=2'")
          elif 'host-tv-lobby.js?v=1' in s:
              s = s.replace('host-tv-lobby.js?v=1', 'host-tv-lobby.js?v=2')
          elif 'host-tv-lobby.js?v=2' not in s:
              loader = """<script src=\"/host-tv-lobby.js?v=2\"></script>"""
              s = s.replace('</body>', loader + '\n</body>')
          p.write_text(s)
          PY

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Refresh Host TV loader'
          git push
