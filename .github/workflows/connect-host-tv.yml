name: Connect Host TV waiting room

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Host TV loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          loader = """<script>
          if(new URLSearchParams(location.search).has('host')){
            const s=document.createElement('script');
            s.src='/host-tv-lobby.js?v=1';
            document.body.appendChild(s);
          }
          </script>"""
          if "host-tv-lobby.js?v=1" not in s:
              s = s.replace('</body>', loader + '\n</body>')
              p.write_text(s)
          PY

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Load full-screen Host TV waiting room'
          git push
