name: Install approved character photos
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.event.head_commit.message == 'Install approved character photos'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install approved sprite and wire character images
        env:
          SPRITE_B64: >-
            
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          data=base64.b64decode(''.join(os.environ['SPRITE_B64'].split()))
          Path('characters').mkdir(exist_ok=True)
          Path('characters/approved-character-sprite.webp').write_bytes(data)
          js='''/* BET YOUR HAND — exact approved face-focused character photos. */
(function(){
  const SPRITE='/characters/approved-character-sprite.webp';
  const chars=['Bug','Face','Ling Ling','Beanz','The One','Boone','Chicken Joe','Juby','Meemaw'];
  const pos={}; chars.forEach((c,i)=>{pos[c]=((i%3)*50)+'% '+(Math.floor(i/3)*50)+'%';});
  function stylePick(){
    document.querySelectorAll('.charPick').forEach(function(b){
      const n=b.querySelector('.charName'); if(!n)return; const ch=n.textContent.trim();
      let im=b.querySelector('.charImg');
      if(!im){im=document.createElement('span');im.className='charImg';b.insertBefore(im,b.firstChild);}
      im.style.backgroundImage='url("'+SPRITE+'")';
      im.style.backgroundSize='300% 300%';
      im.style.backgroundPosition=(pos[ch]||'50% 50%');
      im.setAttribute('aria-label',ch);
    });
  }
  function patchPlayerCards(){
    document.querySelectorAll('#players .player,#gamePlayers .player').forEach(function(d){
      const smalls=d.querySelectorAll('.small'); if(smalls.length<1)return;
      const ch=smalls[0].textContent.trim(); if(chars.indexOf(ch)<0)return;
      let im=d.querySelector('.playerCharImg');
      if(!im){im=document.createElement('span');im.className='playerCharImg';d.insertBefore(im,d.firstChild);}
      im.style.backgroundImage='url("'+SPRITE+'")'; im.style.backgroundSize='300% 300%'; im.style.backgroundPosition=pos[ch];
    });
  }
  function apply(){stylePick();patchPlayerCards();}
  window.addEventListener('load',apply); setInterval(apply,700);
})();
'''
          Path('characters/character-images.js').write_text(js)
          p=Path('index.html'); s=p.read_text()
          s=s.replace('height:100px','height:140px').replace('min-height:150px','min-height:190px')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add characters/approved-character-sprite.webp characters/character-images.js index.html
          git commit -m 'Apply approved character photos'
          git push
