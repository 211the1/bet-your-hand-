name: Random First Player

on:
  push:
    branches: [main]

jobs:
  fix:
    if: github.event.head_commit.message == 'Randomize first player'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Randomize first player
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server.js')
          s=p.read_text()
          old="r.turn=0;r.turnPlayerId=r.players[0]?.id||null"
          new="firstIndex=Math.floor(Math.random()*r.players.length);r.turn=firstIndex;r.turnPlayerId=r.players[firstIndex]?.id||null"
          if old not in s:
              raise SystemExit('Expected first-player setup text not found')
          s=s.replace(old,new,1)
          s=s.replace("function deal(r){r.deck=deck();", "function deal(r){let firstIndex; r.deck=deck();", 1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js
          git commit -m 'Randomize first player' || exit 0
          git push
