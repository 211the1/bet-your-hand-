name: Fix character image rendering

on:
  push:
    branches: [main]

jobs:
  fix-images:
    if: github.event.head_commit.message == 'Fix character image rendering'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lock face-focused character framing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('characters/character-images.js')
          s=p.read_text()
          s=s.replace("im.style.backgroundPosition=(pos[ch]||'50% 50%').replace(/ (\\d+)%$/, ' 22%');", "im.style.backgroundPosition=(pos[ch]||'50% 50%');")
          s=s.replace("im.style.backgroundPosition=pos[ch]||'50% 50%';", "im.style.backgroundPosition=(pos[ch]||'50% 50%');")
          s=s.replace("im.style.backgroundSize='300% 300%';", "im.style.backgroundSize='300% auto';")
          p.write_text(s)
          PY
      - name: Keep character picker clean and centered
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace(".charImg{display:block;width:100%;height:110px;border-radius:10px;background-repeat:no-repeat;background-color:#07052d;background-position:center 22%;", ".charImg{display:block;width:100%;height:110px;border-radius:10px;background-repeat:no-repeat;background-color:#07052d;background-position:center;")
          p.write_text(s)
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html characters/character-images.js
          git diff --cached --quiet || git commit -m "Fix character image rendering"
          git push
