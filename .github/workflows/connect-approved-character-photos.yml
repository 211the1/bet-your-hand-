name: Connect approved character photos

on:
  push:
    branches: [main]

jobs:
  connect:
    if: github.event.head_commit.message != 'Connect approved character photos'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Connect character image script and data attributes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="const n=document.createElement('span'); n.className='charName'; n.textContent=ch; b.appendChild(n);"
          new="b.dataset.character=ch; const n=document.createElement('span'); n.className='charName'; n.textContent=ch; b.appendChild(n);"
          if old not in s:
              raise SystemExit('character selection line not found')
          s=s.replace(old,new,1)
          tag='<script src="/characters/character-images.js"></script>\n'
          if tag not in s:
              s=s.replace('</body>',tag+'</body>',1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Connect approved character photos'
          git push
