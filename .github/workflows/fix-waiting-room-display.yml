name: Fix waiting room display

on:
  push:
    branches: [main]

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix waiting room display'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch waiting room
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="d.className='player '+(i===state.turn?'active':'');"
          new="d.className='player '+(i===state.turn?'active':''); d.dataset.character=p.character||'';"
          if old not in s:
              raise SystemExit('player render line not found')
          s=s.replace(old,new,1)
          old_css='.wrap{max-width:1150px;margin:auto;padding:14px}'
          new_css='.wrap{width:100%;max-width:none;min-height:100vh;margin:0;padding:14px}'
          if old_css not in s:
              raise SystemExit('wrap css not found')
          s=s.replace(old_css,new_css,1)
          old_player='.player{border:2px solid #4031b9;border-radius:15px;padding:10px;background:#09083b}'
          new_player='.player{border:2px solid #4031b9;border-radius:15px;padding:10px;background:#09083b;min-height:145px}'
          if old_player not in s:
              raise SystemExit('player css not found')
          s=s.replace(old_player,new_player,1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/fix-waiting-room-display.yml
          git commit -m 'Fix waiting room display'
          git push
