name: Fix character tile shape
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message == 'Square character portraits'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make character portraits square and uncropped
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='.charImg{display:block;width:100%;height:110px;border-radius:10px;background-repeat:no-repeat;background-color:#07052d;background-position:center;box-shadow:0 0 10px #0008;margin-bottom:6px}'
          new='.charImg{display:block;width:100%;height:auto;aspect-ratio:1/1;border-radius:10px;background-repeat:no-repeat;background-color:#07052d;background-position:center;box-shadow:0 0 10px #0008;margin-bottom:6px}'
          if old not in s:
              raise SystemExit('character image CSS not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit applied fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Square character portraits - applied'
          git push
