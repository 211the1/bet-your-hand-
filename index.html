<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BET&#32;YOUR&#32;HAND</title><style>body{margin:0;background:#070b12;color:#fff;font:16px Arial}main{max-width:760px;margin:auto;padding:16px}h1{text-align:center;font-size:46px}.box{background:#121a28;border:1px solid #30415a;border-radius:20px;padding:18px;margin:12px 0}button,input{width:100%;padding:14px;margin:6px 0;border-radius:12px;font:inherit;box-sizing:border-box}input{background:#0b111b;color:#fff;border:1px solid #46546d}button{border:0;background:#1687ff;color:#fff;font-weight:900}.purple{background:#713cff}.secondary{background:#303b4e}.hide{display:none}.status{text-align:center;color:#8ee6b1}.code{text-align:center;font-size:44px;font-weight:900;letter-spacing:8px}.picker,.hand,.colors{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.char{background:#18243a;border:2px solid #31435d;padding:5px}.char.sel{border-color:#1687ff}.char img{width:100%;height:82px;object-fit:cover;object-position:50% 25%;border-radius:8px}.players{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.player{display:flex;gap:8px;align-items:center;background:#1a2638;padding:8px;border-radius:12px}.player img{width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:50% 25%}.turn{text-align:center;font-size:25px;font-weight:900}.flame{animation:p .8s infinite alternate;filter:drop-shadow(0 0 12px #ff8a00)}@keyframes p{to{transform:scale(1.04)}}.card{width:210px;aspect-ratio:2/2.8;margin:14px auto;border:4px solid white;border-radius:20px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;align-items:center}.card b{font-size:28px}.red{background:#c72f3f}.blue{background:#1c69d9}.green{background:#078c62}.yellow{background:#c79d18;color:#111}.wild{background:linear-gradient(135deg,#d7263d,#1687ff,#08b978,#d4af37)}.special{background:linear-gradient(145deg,#d4af37,#713cff)}.modal{position:fixed;inset:0;background:#050812ee;display:flex;align-items:center;justify-content:center;padding:18px}.modal>div{width:min(500px,100%);background:#172033;border:2px solid #1687ff;border-radius:22px;padding:18px;text-align:center}.call{position:fixed;right:12px;bottom:12px;width:auto;background:#d4af37;color:#111;display:none}@media(min-width:620px){.picker{grid-template-columns:repeat(5,1fr)}.hand{grid-template-columns:repeat(4,1fr)}}</style></head><body><main><h1>BET&#32;YOUR&#32;HAND</h1><section id="home" class="box"><h2>GAME NIGHT</h2><input id="name" maxlength="20" placeholder="Your name"><div id="picker" class="picker"></div><input id="code" maxlength="4" placeholder="Room code"><button id="join">JOIN GAME</button><button id="rules" class="secondary">RULES</button><div id="status" class="status"></div></section><section id="lobby" class="box hide"><div id="room" class="code"></div><div id="players" class="players"></div><button id="leave1" class="purple">LEAVE</button></section><section id="game" class="box hide"><div id="turn" class="turn"></div><div id="info"></div><div id="current"></div><div id="hand" class="hand"></div><button id="draw" class="secondary">DRAW</button><button id="rules2" class="purple">RULES</button><button id="leave2" class="purple">LEAVE</button></section><section id="finish" class="box hide" style="text-align:center"><div class="turn">🏆 GAME OVER</div><h2 id="winner"></h2><p id="final"></p><button id="leave3" class="purple">RETURN TO START</button></section></main><button id="call" class="call">📣 CALL PLAYER</button><div id="modal" class="modal hide"><div><h2 id="mt"></h2><div id="mb"></div></div></div><script>
const WS='wss://bet-your-hand.onrender.com',chars=['Bug','Face','Ling Ling','Beanz','The One','Boone','Chicken Joe','Juby','Meemaw'];let selected='Bug',ws=null,me=null,state=null,retry=null,spinning=false;const $=x=>document.getElementById(x),img=c=>String(c||'Bug').replaceAll(' ','_')+'.jpg',esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));$('picker').innerHTML=chars.map(c=>`<button class="char ${c===selected?'sel':''}" data-c="${c}"><img src="${img(c)}"><b>${c}</b></button>`).join('');document.querySelectorAll('.char').forEach(b=>b.onclick=()=>{selected=b.dataset.c;document.querySelectorAll('.char').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')});function show(x){$(x).classList.remove('hide')}function hide(x){$(x).classList.add('hide')}function send(t,d={}){if(ws?.readyState===1)ws.send(JSON.stringify({type:t,...d}))}function connect(t,d){if(ws&&ws.readyState<2)return;ws=new WebSocket(WS);ws.onopen=()=>{clearTimeout(retry);send(t,d)};ws.onclose=()=>{if(me?.code)retry=setTimeout(()=>connect('RECONNECT',{code:me.code,playerId:me.playerId,reconnectToken:me.reconnectToken}),1500)};ws.onerror=()=>$('status').textContent='Connection problem — reconnecting';ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='ERROR')$('status').textContent=m.error;else if(m.type==='ROOM_JOINED'||m.type==='RECONNECTED'){me={...me,...m};localStorage.setItem('byhSession',JSON.stringify(me));hide('home');show('lobby');$('room').textContent=me.code}else if(m.type==='STATE'){state=m;render()}else if(m.type==='CALL_PLAYER'){show('call');beep();setTimeout(()=>hide('call'),6000)}else if(m.type==='RESET_ROOM'){localStorage.removeItem('byhSession');location.reload()}}}function beep(){try{const a=new(AudioContext||webkitAudioContext),o=a.createOscillator(),g=a.createGain();o.frequency.value=880;g.gain.value=.08;o.connect(g);g.connect(a.destination);o.start();setTimeout(()=>{o.stop();a.close()},220)}catch(_){} }function playable(g,c){return c.type==='WILD'||c.type==='SPECIAL_POWER'||c.color===g.currentColor||c.character===g.topCard?.character}function card(c){return `<div class="card ${c?.type==='SPECIAL_POWER'?'special':c?.type==='WILD'?'wild':c?.color||'blue'}"><div>${esc(c?.type==='SPECIAL_POWER'?'BET YOUR HAND':c?.action||'CHARACTER')}</div><b>${esc(c?.character||c?.action||'—')}</b><div>${esc((c?.color||'POWER').toUpperCase())}</div></div>`}function render(){const g=state?.game;if(!g){show('lobby');hide('game');hide('finish');$('room').textContent=state.roomCode;$('players').innerHTML=(state.players||[]).map(p=>`<div class="player"><img src="${img(p.character)}"><div><b>${esc(p.name)}</b><br>${esc(p.character)}</div></div>`).join('');return}hide('lobby');if(g.phase==='finished'){hide('game');show('finish');const w=g.players.find(p=>p.id===g.winnerId);$('winner').textContent=w?.name||'Winner';$('final').textContent='Final total: '+(w?.points??0)+' points.';return}show('game');const mine=g.players.find(p=>p.id===me.playerId),cur=g.players.find(p=>p.id===g.turnPlayerId);$('turn').innerHTML=cur?.id===mine?.id?'<span class="flame">🔥 YOUR TURN</span>':'Waiting for '+esc(cur?.name||'player');$('info').innerHTML=`Round ${g.round} • Points ${mine?.points??0} • Cards ${mine?.handCount??0} • Color ${(g.currentColor||'—').toUpperCase()}`;$('current').innerHTML=card(g.topCard);$('hand').innerHTML=(g.viewerHand||[]).map((c,i)=>`<button ${playable(g,c)?'':'disabled'} onclick="play(${i})">${esc(c.character||c.action)}<br><small>${esc((c.color||'POWER').toUpperCase())}</small></button>`).join('');$('draw').disabled=cur?.id!==mine?.id||(g.viewerHand||[]).some(c=>playable(g,c));if(cur?.id===mine?.id&&g.pendingAction==='WILD_COLOR')colors('CHOOSE A COLOR');else if(cur?.id===mine?.id&&g.pendingAction==='COLOR_CHOICE')colors('POWER — CHOOSE A COLOR');else if(cur?.id===mine?.id&&g.pendingAction==='POWER_WHEEL'&&!spinning){spinning=true;wheel();setTimeout(()=>send('SPIN_WHEEL'),900)}}function play(i){send('PLAY_CARD',{handIndex:i})}function colors(t){$('mt').textContent=t;$('mb').innerHTML='<div class="colors">'+['red','blue','green','yellow'].map(c=>`<button onclick="choose('${c}')">${c.toUpperCase()}</button>`).join('')+'</div>';$('modal').classList.remove('hide')}function choose(c){hide('modal');send('CHOOSE_COLOR',{color:c})}function wheel(){$('mt').textContent='POWER WHEEL';$('mb').innerHTML='<div class="wheel">SPINNING</div><p>Every section has an equal chance.</p>';$('modal').classList.remove('hide')}function rules(){$('mt').textContent='RULES';$('mb').innerHTML='<p>2–6 players, 8 cards each, 500 starting points.</p><p>Match color or character. If none is playable, draw until one is available. A playable card at the start of a turn gives +150 points.</p><p>SKIP skips the next turn unless SHIELD blocks it. REVERSE changes direction and with 2 players acts as a skip. WILD lets you choose the next color.</p><p>The special card activates the Power Wheel. It can award EXTRA PLAY, SHIELD, COLOR CHOICE or TURN SWITCH. Each awarded power is one-time.</p><p>Two rounds. Round 1 points carry into Round 2. Highest total after Round 2 wins.</p><button onclick="hide(\'modal\')">CLOSE</button>';$('modal').classList.remove('hide')}$('rules').onclick=rules;$('rules2').onclick=rules;$('join').onclick=()=>{const name=$('name').value.trim()||'Player',code=$('code').value.trim().toUpperCase();if(code.length!==4){$('status').textContent='Enter the 4-character room code';return}me={name,character:selected,code};connect('JOIN_ROOM',{code,name,character:selected})};$('draw').onclick=()=>send('DRAW');function leave(){localStorage.removeItem('byhSession');if(ws)ws.close();location.reload()}$('leave1').onclick=leave;$('leave2').onclick=leave;$('leave3').onclick=leave;try{me=JSON.parse(localStorage.getItem('byhSession')||'null')}catch(_){}if(me?.code&&me?.playerId)connect('RECONNECT',{code:me.code,playerId:me.playerId,reconnectToken:me.reconnectToken});
</script></body></html>
