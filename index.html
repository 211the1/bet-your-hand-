<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BET YOUR HAND</title><style>:root{--b:#1687ff;--p:#713cff;--g:#08b978;--y:#d4af37;--r:#ff3048;--bg:#070b12}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1b3150,#070b12 62%);color:#fff;font:16px Arial;min-height:100vh}main{max-width:760px;margin:auto;padding:16px}h1{text-align:center;font-size:clamp(36px,10vw,60px);margin:5px 0}.sub{text-align:center;color:#aab6c8}.panel{background:#121a28f5;border:1px solid #30415a;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 15px 40px #0008}.hidden{display:none!important}input,button{font:inherit}input{width:100%;padding:14px;margin:6px 0;border:1px solid #46546d;border-radius:12px;background:#0b111b;color:#fff}button{width:100%;padding:14px;margin:6px 0;border:0;border-radius:13px;background:var(--b);color:#fff;font-weight:900}button:disabled{opacity:.35}.purple{background:var(--p)}.secondary{background:#303b4e}.status{text-align:center;color:#8ee6b1;min-height:24px}.code{text-align:center;font-size:46px;font-weight:900;letter-spacing:10px}.picker{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.char{padding:5px;background:#18243a;border:2px solid #31435d;min-height:135px}.char.sel{border-color:var(--b);box-shadow:0 0 18px #1687ff88}.char img{width:100%;height:86px;object-fit:cover;object-position:50% 25%;border-radius:9px}.char b{display:block;margin-top:5px}.players{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.player{display:flex;align-items:center;gap:8px;background:#1a2638;border-radius:13px;padding:8px}.player img{width:44px;height:44px;object-fit:cover;object-position:50% 25%;border-radius:50%}.me{outline:2px solid var(--b)}.turn{text-align:center;font-size:25px;font-weight:900}.flame{animation:pulse .8s infinite alternate;filter:drop-shadow(0 0 10px #ff8a00)}@keyframes pulse{to{transform:scale(1.04);filter:drop-shadow(0 0 18px #ff3048)}}.info{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:#dbe4f2}.current{text-align:center;margin:14px 0}.card{width:min(230px,58vw);aspect-ratio:2/2.8;margin:auto;border:4px solid #fff;border-radius:22px;padding:15px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;box-shadow:0 18px 40px #0009}.card .name{font-size:30px;font-weight:900}.red{background:#c72f3f}.blue{background:#1c69d9}.green{background:#078c62}.yellow{background:#c79d18;color:#111}.wild{background:linear-gradient(135deg,#d7263d,#1687ff,#08b978,#d4af37)}.special{background:linear-gradient(145deg,#d4af37,#713cff)}.hand{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.hand button{min-height:106px;background:#182c49;border:2px solid #476b9d}.hand button.play{box-shadow:0 0 20px #1687ff99}.hand .name{font-size:18px}.actions{display:flex;gap:8px}.actions button{flex:1}.modal{position:fixed;inset:0;background:#050812ee;display:flex;align-items:center;justify-content:center;padding:18px;z-index:30}.modalbox{width:min(520px,100%);background:#172033;border:2px solid var(--b);border-radius:24px;padding:20px;text-align:center}.colors{display:grid;grid-template-columns:1fr 1fr;gap:8px}.colors button{height:70px}.wheel{width:min(300px,72vw);aspect-ratio:1;margin:12px auto;border:9px solid #fff;border-radius:50%;background:conic-gradient(#1687ff 0 11.11%,#713cff 11.11% 22.22%,#08b978 22.22% 33.33%,#d4af37 33.33% 44.44%,#1687ff 44.44% 55.55%,#08b978 55.55% 66.66%,#713cff 66.66% 77.77%,#d4af37 77.77% 88.88%,#ff3048 88.88%);display:grid;place-items:center;font-weight:900;transition:transform 2s}.spin{transform:rotate(1440deg)}.winner{text-align:center;font-size:42px;font-weight:900;color:#ffd94a}.call{position:fixed;right:14px;bottom:14px;width:auto;background:var(--y);color:#111;border-radius:30px;z-index:40;display:none}@media(min-width:620px){.picker{grid-template-columns:repeat(5,1fr)}.hand{grid-template-columns:repeat(4,1fr)}}</style></head><body><main><h1>BET YOUR HAND</h1><div class="sub">GAME NIGHT</div>
<section id="home" class="panel"><h2>JOIN GAME NIGHT</h2><input id="name" maxlength="20" placeholder="Your name"><h3>Choose your character</h3><div id="picker" class="picker"></div><input id="code" maxlength="4" placeholder="Room code"><button id="join">JOIN GAME</button><button id="rules" class="secondary">RULES</button><div id="status" class="status"></div></section>
<section id="lobby" class="panel hidden"><div class="sub">ROOM CODE</div><div id="roomCode" class="code"></div><div id="lobbyStatus" class="status"></div><div id="lobbyPlayers" class="players"></div><p class="sub">Waiting for the host to start. 2–6 players.</p><button id="leaveLobby" class="purple">LEAVE GAME</button></section>
<section id="game" class="panel hidden"><div id="turn" class="turn"></div><div id="info" class="info"></div><div id="current" class="current"></div><div id="hand" class="hand"></div><div class="actions"><button id="draw" class="secondary">DRAW</button><button id="gameRules" class="purple">RULES</button></div></section>
<section id="finish" class="panel hidden" style="text-align:center"><div class="winner">GAME OVER</div><h2 id="winnerName"></h2><p id="finishInfo"></p><button id="finishLeave" class="purple">RETURN TO START</button></section></main><button id="callNotice" class="call">📣 CALL PLAYER</button><div id="modal" class="modal hidden"><div class="modalbox"><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div>
<script>
const WS='wss://bet-your-hand.onrender.com',chars=['Bug','Face','Ling Ling','Beanz','The One','Boone','Chicken Joe','Juby','Meemaw'];let selected='Bug',ws=null,me=null,state=null,retry=null,spinning=false,lastRound=0;const $=x=>document.getElementById(x);const img=c=>String(c||'Bug').replaceAll(' ','_')+'.jpg';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('picker').innerHTML=chars.map(c=>`<button class="char ${c===selected?'sel':''}" data-c="${esc(c)}"><img src="${img(c)}"><b>${esc(c)}</b></button>`).join('');document.querySelectorAll('.char').forEach(b=>b.onclick=()=>{selected=b.dataset.c;document.querySelectorAll('.char').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')});
function show(id){$(id).classList.remove('hidden')}function hide(id){$(id).classList.add('hidden')}function status(s){$('status').textContent=s;$('lobbyStatus').textContent=s}function send(type,data={}){if(ws?.readyState===1)ws.send(JSON.stringify({type,...data}))}
function connect(mode,data){if(ws&&ws.readyState<2)return;ws=new WebSocket(WS);ws.onopen=()=>{clearTimeout(retry);send(mode,data)};ws.onerror=()=>status('Connection problem — retrying');ws.onclose=()=>{if(me?.code)retry=setTimeout(()=>connect('RECONNECT',{code:me.code,playerId:me.playerId,reconnectToken:me.reconnectToken}),1500)};ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='ERROR'){status(m.error);if(/Room not found|Invalid reconnect/.test(m.error)){localStorage.removeItem('byhSession');me=null}}else if(m.type==='ROOM_JOINED'||m.type==='RECONNECTED'){me={...me,...m};localStorage.setItem('byhSession',JSON.stringify(me));hide('home');show('lobby');$('roomCode').textContent=me.code}else if(m.type==='STATE'){state=m;render()}else if(m.type==='CALL_PLAYER'){show('callNotice');beep();setTimeout(()=>hide('callNotice'),6000)}else if(m.type==='RESET_ROOM'){localStorage.removeItem('byhSession');location.reload()}}}
function beep(){try{const C=AudioContext||webkitAudioContext,a=new C(),o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.value=.08;o.start();setTimeout(()=>{o.stop();a.close()},250)}catch(_){} }
function say(t){try{if(speechSynthesis){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}}catch(_){} }
function playable(g,c){const t=g.topCard;if(c.type==='WILD'||c.type==='SPECIAL_POWER')return true;return c.color===g.currentColor||(c.character&&t?.character===c.character)}function cardClass(c){return c?.type==='SPECIAL_POWER'?'special':c?.type==='WILD'?'wild':c?.color||'blue'}function cardName(c){return c?.character||c?.action||'—'}function card(c){return `<div class="card ${cardClass(c)}"><div>${esc(c?.type==='SPECIAL_POWER'?'BET YOUR HAND':c?.action||'CHARACTER')}</div><div class="name">${esc(cardName(c))}</div><div>${esc((c?.color||'POWER').toUpperCase())}</div></div>`}
function render(){if(!state)return;const g=state.game;if(!g){show('lobby');hide('game');hide('finish');$('roomCode').textContent=state.roomCode;$('lobbyPlayers').innerHTML=state.players.map(p=>`<div class="player ${p.id===me?.playerId?'me':''}"><img src="${img(p.character)}"><div><b>${esc(p.name)}</b><br><small>${esc(p.character)}</small></div></div>`).join('');return}hide('lobby');if(g.phase==='finished'){hide('game');show('finish');const w=g.players.find(p=>p.id===g.winnerId);$('winnerName').textContent=w?.name||'Winner';$('finishInfo').textContent='Final total: '+(w?.points??0)+' points.';if(!state.said){state.said=true;say('Thank you everybody for coming out to Game Night. Thank you for playing the game.')}return}show('game');hide('finish');const mine=g.players.find(p=>p.id===me?.playerId),cur=g.players.find(p=>p.id===g.turnPlayerId);if(lastRound&&g.round!==lastRound)say('Round '+g.round+'. Points carry forward.');lastRound=g.round;$('turn').innerHTML=cur?.id===mine?.id?'<span class="flame">🔥 YOUR TURN</span>':`Waiting for ${esc(cur?.name||'player')}`;$('info').innerHTML=`<span>Round ${g.round}</span><span>Points ${mine?.points??0}</span><span>Cards ${mine?.handCount??0}</span><span>Color ${(g.currentColor||'—').toUpperCase()}</span>`;$('current').innerHTML=card(g.topCard);$('hand').innerHTML=(g.viewerHand||[]).map((c,i)=>`<button class="${playable(g,c)?'play':''}" onclick="play(${i})"><span class="name">${esc(cardName(c))}</span><small>${esc((c.color||'POWER').toUpperCase())}</small></button>`).join('');$('draw').disabled=cur?.id!==mine?.id||(g.viewerHand||[]).some(c=>playable(g,c));if(g.pendingAction==='WILD_COLOR'&&cur?.id===mine?.id)colorModal('CHOOSE A COLOR');else if(g.pendingAction==='COLOR_CHOICE'&&cur?.id===mine?.id)colorModal('POWER — CHOOSE A COLOR');else if(g.pendingAction==='POWER_WHEEL'&&cur?.id===mine?.id&&!spinning){spinning=true;wheelModal();setTimeout(()=>send('SPIN_WHEEL'),900)}else if(g.wheelResult&&!g.pendingAction&&!spinning)resultModal(g.wheelResult);else if(!g.pendingAction)spinning=false}
function play(i){send('PLAY_CARD',{handIndex:i})}function colorModal(title){$('modalTitle').textContent=title;$('modalBody').innerHTML='<div class="colors">'+['red','blue','green','yellow'].map(c=>`<button class="${c}" onclick="choose('${c}')">${c.toUpperCase()}</button>`).join('')+'</div>';$('modal').classList.remove('hidden')}function choose(c){hide('modal');send('CHOOSE_COLOR',{color:c})}function wheelModal(){$('modalTitle').textContent='POWER WHEEL';$('modalBody').innerHTML='<div id="wheel" class="wheel">SPINNING</div><p>Every section has an equal chance.</p>';$('modal').classList.remove('hidden');setTimeout(()=>$('wheel')?.classList.add('spin'),20)}function resultModal(r){$('modalTitle').textContent='POWER WON';$('modalBody').innerHTML=`<h2>${esc(r.character)}</h2><p style="font-size:24px;font-weight:900">${esc(r.power)}</p><button onclick="hide('modal');spinning=false">CONTINUE</button>`;$('modal').classList.remove('hidden')}
function rules(){ $('modalTitle').textContent='HOW TO PLAY';$('modalBody').innerHTML='<p>2–6 players. Start with 8 cards and 500 points.</p><p>Match the current color or character. If you have no playable card, draw until you do. A playable card at the start of your turn earns +150 points.</p><p>SKIP skips the next turn unless SHIELD blocks it. REVERSE changes direction and with 2 players acts as a skip. WILD lets its player choose the next color.</p><p>The BET YOUR HAND card activates the Power Wheel. The wheel randomly awards EXTRA PLAY, SHIELD, COLOR CHOICE, or TURN SWITCH. Each awarded power is used once.</p><p>There are two rounds. Round 1 points carry into Round 2. Highest total after Round 2 wins.</p><button onclick="hide(\'modal\')">CLOSE</button>';$('modal').classList.remove('hidden')}$('rules').onclick=rules;$('gameRules').onclick=rules;$('join').onclick=()=>{const name=$('name').value.trim()||'Player',code=$('code').value.trim().toUpperCase();if(code.length!==4){status('Enter the 4-character room code');return}me={name,character:selected,code};connect('JOIN_ROOM',{code,name,character:selected})};$('draw').onclick=()=>send('DRAW');$('leaveLobby').onclick=$('finishLeave').onclick=$('leave').onclick=()=>{localStorage.removeItem('byhSession');if(ws)ws.close();location.reload()};
try{me=JSON.parse(localStorage.getItem('byhSession')||'null')}catch(_){me=null}if(me?.code&&me?.playerId)connect('RECONNECT',{code:me.code,playerId:me.playerId,reconnectToken:me.reconnectToken});
</script></body></html>
