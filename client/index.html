<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLAY YOUR HAND</title><meta name="theme-color" content="#050a24"><link rel="manifest" href="/client/manifest.webmanifest"><link rel="stylesheet" href="/client/style.css?v=53"><link rel="stylesheet" href="/client/flame-fix.css?v=2"><style>
/* HOST CHARACTER WALKER — player screens only */
#player-host-wanderer{position:fixed;left:-24vw;top:50%;z-index:5000;width:clamp(110px,18vw,220px);pointer-events:none;display:none;will-change:left,top,transform;filter:drop-shadow(0 8px 8px #0009);animation:playerHostTravel 20s linear infinite}
#player-host-wanderer img{display:block;width:100%;height:auto;object-fit:contain;transform-origin:center bottom;animation:playerHostBob .62s ease-in-out infinite}
body.player-host-walking #player-host-wanderer{display:block}
@keyframes playerHostTravel{
  0%{left:-24vw;top:58%;transform:scaleX(1)}
  34%{left:32%;top:44%;transform:scaleX(1)}
  38%{left:36%;top:44%;transform:scaleX(-1)}
  70%{left:78%;top:57%;transform:scaleX(-1)}
  74%{left:82%;top:57%;transform:scaleX(1)}
  100%{left:124vw;top:40%;transform:scaleX(1)}
}
@keyframes playerHostBob{
  0%,100%{transform:translateY(0) rotate(0deg) scaleY(1)}
  25%{transform:translateY(-6px) rotate(-2deg) scaleY(.99)}
  50%{transform:translateY(0) rotate(0deg) scaleY(1)}
  75%{transform:translateY(-6px) rotate(2deg) scaleY(.99)}
}
@media(max-width:600px){
  #player-host-wanderer{width:118px;animation-duration:17s}
}
</style></head><body class="player-page"><main>
  <button id="open-join" class="open-join" hidden>MENU</button>
  <div id="join-panel" class="join-panel prejoin show" aria-hidden="false">
    <div class="join-box">
      <h2>JOIN GAME</h2>
      <p>Enter your room information</p><div class="character-picker-title">CHOOSE YOUR CHARACTER</div>
      <input id="code" maxlength="4" placeholder="ROOM CODE">
      <input id="name" placeholder="YOUR NAME">
      <select id="char" class="character-select-hidden"></select><div id="character-grid" class="character-grid" aria-label="Choose a character"></div>
      <button id="join" type="button">JOIN GAME</button>
      <div id="status"></div>
    </div>
  </div>
  <section id="game"></section>
  <div id="player-host-wanderer" aria-hidden="true"><img src="/host-character.png" alt=""></div>
</main><script src="/client/app.js?v=79"></script><script>
(()=>{
 const code=document.getElementById('code'),sel=document.getElementById('char'),status=document.getElementById('status'),game=document.getElementById('game'),joinPanel=document.getElementById('join-panel');
 let preview=null,timer=null,gameOverShown=false;
 const gameOverKey=()=>{const c=code.value.trim().toUpperCase();return c?`byhGameOver:${c}`:'byhGameOver:unknown'};
 function syncHostWalker(){
   const active=!!game&&!!game.children.length&&!!joinPanel&&!joinPanel.classList.contains('show');
   document.body.classList.toggle('player-host-walking',active);
 }
 window.refreshCharacterChoices=function(taken=[]){
 const grid=document.getElementById('character-grid'); if(!grid)return;
 const chars=['Bug','Face','Ling Ling','Beanz','The One','Boone','Chicken Joe','Juby','Meemaw'];
 const imgs={'Bug':'/Bug.jpg','Face':'/Face.jpg','Ling Ling':'/Ling_Ling.jpg','Beanz':'/Beanz.jpg','The One':'/The_One.jpg','Boone':'/Boone.jpg','Chicken Joe':'/Chicken_Joe.jpg','Juby':'/Juby.jpg','Meemaw':'/Meemaw.jpg'};
 const current=sel.value;
 grid.innerHTML=chars.map(c=>'<button type="button" class="character-choice'+(current===c?' selected':'')+(taken.includes(c)?' taken':'')+'" data-character="'+c+'"'+(taken.includes(c)?' disabled':'')+'><img src="'+imgs[c]+'" alt="'+c+'"><span>'+c+'</span><i>'+(taken.includes(c)?'TAKEN':(current===c?'✓':''))+'</i></button>').join('');
 grid.querySelectorAll('.character-choice:not([disabled])').forEach(btn=>btn.onclick=()=>{sel.value=btn.dataset.character;grid.querySelectorAll('.character-choice').forEach(x=>x.classList.remove('selected'));btn.classList.add('selected');});
 };
 window.refreshCharacterChoices([]);
 function apply(players){
 const taken=(players||[]).map(p=>p.character).filter(Boolean);
 const current=sel.value;
 sel.replaceChildren(new Option('TAP TO CHOOSE CHARACTER',''));
 ['Bug','Face','Ling Ling','Beanz','The One','Boone','Chicken Joe','Juby','Meemaw'].forEach(c=>{
   const o=new Option(taken.includes(c)?c+' — TAKEN':c,c);
   o.disabled=taken.includes(c);
   sel.add(o);
 });
 if(current && !taken.includes(current)) sel.value=current;
 if(window.refreshCharacterChoices) window.refreshCharacterChoices(taken);
}
 function previewRoom(){const c=code.value.trim().toUpperCase();if(c.length!==4)return;if(preview){try{preview.close()}catch{}preview=null}const proto=location.protocol==='https:'?'wss:':'ws:';preview=new WebSocket(proto+'//'+location.host);preview.onopen=()=>preview.send(JSON.stringify({type:'PREVIEW_ROOM',code:c}));preview.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='ROOM_PREVIEW'&&m.code===c)apply(m.players)}catch{}};preview.onerror=()=>{};preview.onclose=()=>{preview=null}}
 function enableHandScroll(){const hand=game.querySelector('.hand-grid');if(!hand||hand.dataset.scrollReady)return;hand.dataset.scrollReady='1';hand.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)&&hand.scrollWidth>hand.clientWidth){hand.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});let dragging=false,startX=0,startScroll=0,moved=false;hand.addEventListener('mousedown',e=>{if(e.button!==0)return;if(e.target.closest('.arcade-card'))return;dragging=true;moved=false;startX=e.clientX;startScroll=hand.scrollLeft;hand.style.cursor='grabbing';e.preventDefault()});window.addEventListener('mousemove',e=>{if(!dragging)return;const dx=e.clientX-startX;if(Math.abs(dx)>5)moved=true;hand.scrollLeft=startScroll-dx;if(moved)e.preventDefault()});window.addEventListener('mouseup',()=>{if(!dragging)return;dragging=false;hand.style.cursor='grab';setTimeout(()=>{moved=false},0)});hand.addEventListener('click',e=>{if(moved){e.preventDefault();e.stopPropagation()}},true)}
 function showGameOver(){if(gameOverShown)return;gameOverShown=true;localStorage.setItem(gameOverKey(),'1');game.innerHTML='<div style="text-align:center;padding:36px 12px"><h2 style="font-size:42px;color:#21f17d;text-shadow:0 0 18px #21f17d;margin:10px 0">GAME OVER</h2><h3 style="font-size:22px;margin:8px 0">GAME NIGHT COMPLETE</h3><p style="font-size:16px">Round 2 is finished.</p><p style="font-size:14px">Final scores are complete. Return to the Host screen to start a new game.</p></div>';syncHostWalker();}
 function checkGameOver(){const round2=Array.from(game.querySelectorAll('.game-top h2')).some(x=>x.textContent.trim()==='ROUND 2');const waiting=game.querySelector('.waiting');const waitingForNoPlayer=waiting&&waiting.textContent.trim()==='WAITING · —';if(round2&&waitingForNoPlayer){showGameOver()}else if(!round2||!waitingForNoPlayer){gameOverShown=false;localStorage.removeItem(gameOverKey())}}
 function restoreGameOver(){if(localStorage.getItem(gameOverKey())==='1')showGameOver();syncHostWalker();}
 code.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(previewRoom,250)});code.addEventListener('change',previewRoom);code.addEventListener('blur',previewRoom);
 new MutationObserver(()=>{enableHandScroll();checkGameOver();syncHostWalker()}).observe(game,{childList:true,subtree:true});
 new MutationObserver(syncHostWalker).observe(joinPanel,{attributes:true,attributeFilter:['class']});
 window.addEventListener('pageshow',restoreGameOver);
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')restoreGameOver()});
 enableHandScroll();
 restoreGameOver();
})();
</script><script>
(()=>{const open=document.getElementById('open-join'),panel=document.getElementById('join-panel');
if(open&&panel)open.addEventListener('click',()=>{panel.classList.add('show');panel.setAttribute('aria-hidden','false');document.getElementById('code')?.focus()});
})();</script><script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js',{scope:'/'}).catch(()=>{});}</script></body></html>
