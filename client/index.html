<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLAY YOUR HAND</title><link rel="stylesheet" href="/client/style.css?v=13"></head><body class="player-page"><main>
  <div class="player-brand"><h1>PLAY YOUR HAND</h1><p>GAME NIGHT</p></div>
  <button id="open-join" class="open-join">JOIN GAME</button>
  <div id="join-panel" class="join-panel" aria-hidden="true">
    <div class="join-box">
      <button id="close-join" class="close-join" type="button" aria-label="Close">X</button>
      <h2>JOIN GAME</h2>
      <p>Enter your room information</p>
      <input id="code" maxlength="4" placeholder="ROOM CODE">
      <input id="name" placeholder="YOUR NAME">
      <select id="char"></select>
      <button id="join" type="button">JOIN GAME</button>
      <div id="status"></div>
    </div>
  </div>
  <section id="game"></section>
</main><script src="/client/app.js?v=17"></script><script>
(()=>{
 const code=document.getElementById('code'),sel=document.getElementById('char'),status=document.getElementById('status'),game=document.getElementById('game');
 let preview=null,timer=null,gameOverShown=false;
 const gameOverKey=()=>{const c=code.value.trim().toUpperCase();return c?`byhGameOver:${c}`:'byhGameOver:unknown'};
 function apply(players){const taken=new Set((players||[]).map(p=>p.character));Array.from(sel.options).forEach(o=>{if(!o.value)return;o.disabled=taken.has(o.value);if(o.disabled)o.textContent=o.value+' — TAKEN';else o.textContent=o.value});if(sel.value&&taken.has(sel.value))sel.value='';}
 function previewRoom(){const c=code.value.trim().toUpperCase();if(c.length!==4)return;if(preview){try{preview.close()}catch{}preview=null}const proto=location.protocol==='https:'?'wss:':'ws:';preview=new WebSocket(proto+'//'+location.host);preview.onopen=()=>preview.send(JSON.stringify({type:'PREVIEW_ROOM',code:c}));preview.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='ROOM_PREVIEW'&&m.code===c)apply(m.players)}catch{}};preview.onerror=()=>{};preview.onclose=()=>{preview=null}}
 function enableHandScroll(){const hand=game.querySelector('.hand-grid');if(!hand||hand.dataset.scrollReady)return;hand.dataset.scrollReady='1';hand.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)&&hand.scrollWidth>hand.clientWidth){hand.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});let dragging=false,startX=0,startScroll=0,moved=false;hand.addEventListener('mousedown',e=>{if(e.button!==0)return;dragging=true;moved=false;startX=e.clientX;startScroll=hand.scrollLeft;hand.style.cursor='grabbing'});window.addEventListener('mousemove',e=>{if(!dragging)return;const dx=e.clientX-startX;if(Math.abs(dx)>5)moved=true;hand.scrollLeft=startScroll-dx;if(moved)e.preventDefault()});window.addEventListener('mouseup',()=>{if(!dragging)return;dragging=false;hand.style.cursor='grab';setTimeout(()=>{moved=false},0)});hand.addEventListener('click',e=>{if(moved){e.preventDefault();e.stopPropagation()}},true)}
 function showGameOver(){if(gameOverShown)return;gameOverShown=true;localStorage.setItem(gameOverKey(),'1');game.innerHTML='<div style="text-align:center;padding:36px 12px"><h2 style="font-size:42px;color:#21f17d;text-shadow:0 0 18px #21f17d;margin:10px 0">GAME OVER</h2><h3 style="font-size:22px;margin:8px 0">GAME NIGHT COMPLETE</h3><p style="font-size:16px">Round 2 is finished.</p><p style="font-size:14px">Final scores are complete. Return to the Host screen to start a new game.</p></div>';}
 function checkGameOver(){const round2=Array.from(game.querySelectorAll('.game-top h2')).some(x=>x.textContent.trim()==='ROUND 2');const waiting=game.querySelector('.waiting');const waitingForNoPlayer=waiting&&waiting.textContent.trim()==='WAITING · —';if(round2&&waitingForNoPlayer){showGameOver()}else if(!round2||!waitingForNoPlayer){gameOverShown=false;localStorage.removeItem(gameOverKey())}}
 function restoreGameOver(){if(localStorage.getItem(gameOverKey())==='1')showGameOver();}
 code.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(previewRoom,250)});code.addEventListener('change',previewRoom);code.addEventListener('blur',previewRoom);
 new MutationObserver(()=>{if((status.textContent||'').toLowerCase().includes('invalid reconnect')){localStorage.removeItem('byhPlayerSession');location.reload()}}).observe(status,{childList:true,characterData:true,subtree:true});
 new MutationObserver(()=>{enableHandScroll();checkGameOver()}).observe(game,{childList:true,subtree:true});
 window.addEventListener('pageshow',restoreGameOver);
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')restoreGameOver()});
 enableHandScroll();
 restoreGameOver();
})();
</script><script>
(()=>{const panel=document.getElementById('join-panel'),open=document.getElementById('open-join'),close=document.getElementById('close-join'),status=document.getElementById('status');
function show(){panel.classList.add('show');panel.setAttribute('aria-hidden','false');document.getElementById('code').focus()}
function hide(){panel.classList.remove('show');panel.setAttribute('aria-hidden','true')}
open.addEventListener('click',show);close.addEventListener('click',hide);
panel.addEventListener('click',e=>{if(e.target===panel)hide()});
new MutationObserver(()=>{if((status.textContent||'').toLowerCase().includes('joined room'))hide()}).observe(status,{childList:true,characterData:true,subtree:true});
try{if(JSON.parse(localStorage.getItem('byhPlayerSession')||'null')?.playerId)hide()}catch{}
})();</script></body></html>
